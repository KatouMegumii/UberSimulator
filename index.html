<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桥西夜班 · 首轮验证 Demo</title>
<style>
:root{color-scheme:dark;--acc:#ff7a1a;--ok:#21c065;--bad:#ff5a5a;--ink:#ecebe7;--dim:#9a9a9f;--panel:rgba(12,14,18,.78)}
*{box-sizing:border-box}

/* HUD */

#energyFill{height:100%;width:80%;background:linear-gradient(90deg,#21c065,#c8f06a);transition:width .4s}#energyFill.low{background:linear-gradient(90deg,#ff5a5a,#ff9a5a)}

#navBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(18,26,36,.86);border-radius:12px;padding:8px 18px 8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.4);border-left:4px solid #1fa3ff}
#navArrow{font-size:36px;line-height:1;width:40px;text-align:center;color:#6fc8ff}
#navDist{font-size:22px;font-weight:700}#navRoad{font-size:13px;opacity:.85}
#navDdl{font-size:12px;color:#9fe8b0;margin-left:8px}#navDdl.warn{color:#ffc04a}#navDdl.late{color:#ff6a5a}
#prompt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel);padding:9px 18px;border-radius:22px;font-size:15px;border:1px solid rgba(255,255,255,.15)}
kbd,.kbd{display:inline-block;background:#f2f2f2;color:#111;border-radius:5px;padding:0 7px;margin-right:6px;font-family:inherit;font-weight:700;font-size:13px}
#dialog{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);width:min(620px,52vw);background:rgba(10,11,14,.86);border-radius:14px;padding:13px 18px;border-left:3px solid #d5a8ff}
#dlgName{font-size:13px;color:#d5a8ff;margin-bottom:4px;font-weight:700}#dlgText{font-size:16px;line-height:1.6}
#dlgChoices{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.choice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
.choice:hover{background:rgba(213,168,255,.16)}.choice.locked{opacity:.4}
#toasts{position:fixed;left:16px;top:170px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:380px}
.toast{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 13px;font-size:13px;animation:tin .25s ease-out}
.toast.money{border-color:rgba(33,192,101,.6)}.toast.warn{border-color:rgba(255,90,90,.7)}.toast.voice{color:#ffcf9a;border-color:rgba(255,122,26,.4)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#help{position:fixed;left:16px;bottom:14px;font-size:12px;color:#c9c9cc;background:var(--panel);border-radius:10px;padding:8px 12px;line-height:1.9;max-width:560px}
#phoneHint{position:fixed;right:18px;bottom:10px;font-size:12px;color:#aaa;background:var(--panel);padding:4px 10px;border-radius:10px}
/* ---------- 手机 ---------- */
#phone{position:fixed;left:0;top:0;width:360px;height:760px;border-radius:46px;background:#000;overflow:hidden;transform-origin:0 0;z-index:20;box-shadow:0 0 0 2px #1b1c1f;font-size:14px;color:#111}
#phone.ph-hand{left:auto;top:auto;right:24px;bottom:30px;transform-origin:100% 100%;box-shadow:0 0 0 7px #16171a,0 0 0 9px #3a3c42,0 20px 60px rgba(0,0,0,.6)}
#pStatus{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:600;color:#fff;z-index:5;pointer-events:none;mix-blend-mode:difference}
.isl{width:96px;height:28px;background:#000;border-radius:16px;mix-blend-mode:normal}
#pScreen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#f3f4f6}
#pScreen::-webkit-scrollbar{width:0}
#pScreen.home{background:#000}
#pHomeBar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:rgba(120,120,120,.8);z-index:6;cursor:pointer}
#pBanner{position:absolute;top:-90px;left:10px;right:10px;background:rgba(245,245,247,.96);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;transition:top .35s;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;color:#111}

.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.wall{min-height:100%;padding:70px 22px 24px;color:#fff;background:radial-gradient(ellipse at 70% 0%,#3a4a8a 0%,transparent 60%),linear-gradient(180deg,#141c3c 0%,#2a2350 45%,#7a3a5a 75%,#d07050 100%);position:relative}
.wall:after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#0b0e1a 0 18px,#141a2c 18px 30px,#0b0e1a 30px 44px,#10152a 44px 62px);clip-path:polygon(0 60%,6% 60%,6% 35%,10% 35%,10% 55%,18% 55%,18% 20%,21% 8%,24% 20%,24% 50%,32% 50%,32% 30%,40% 30%,40% 60%,48% 60%,48% 10%,50% 0,52% 10%,52% 45%,60% 45%,60% 25%,70% 25%,70% 55%,78% 55%,78% 38%,86% 38%,86% 62%,100% 62%,100% 100%,0 100%);pointer-events:none}
.wclock{font-size:76px;font-weight:300;text-align:center;letter-spacing:2px;line-height:1}.wdate{text-align:center;font-size:14px;opacity:.85;margin:6px 0 18px}
.widget{background:rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:20px;padding:12px 14px;font-size:13px;margin-bottom:22px}
.widget .muted{color:rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.icon{text-align:center;cursor:pointer}.ico{width:60px;height:60px;border-radius:15px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ico.s{width:38px;height:38px;border-radius:10px;font-size:18px;flex:none;margin:0}
.iname{font-size:11.5px;margin-top:5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bdg{position:absolute;top:-5px;right:-5px;background:#ff3b30;color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.dock{position:absolute;left:12px;right:12px;bottom:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px);border-radius:26px;padding:12px;display:flex;justify-content:center;z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
.muted{color:#8a8c92;font-size:12px}.c{text-align:center}
.appbar{position:sticky;top:0;z-index:3;height:92px;padding:48px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:#fff}
.appbar .back{cursor:pointer;font-size:26px;width:40px;font-weight:400}.appbar span:last-child{min-width:40px;text-align:right;font-size:12px}
.appbar.didi{background:linear-gradient(90deg,#ff8a2a,#ff6a00)}.appbar.bank{background:#c41f2c}.appbar.ths{background:#e33b2a}.appbar.msgb{background:#f7f7f7;color:#111;border-bottom:1px solid #e3e3e3}
.abody{padding:10px 12px 90px}
.atabs{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid #e6e6e6;padding:8px 0 22px;z-index:3}.atabs div{flex:1;text-align:center;font-size:13px;color:#888;cursor:pointer;position:relative}.atabs div.on{color:#ff6a00;font-weight:700}.atabs.ths div.on{color:#e33b2a}
.pip{position:absolute;top:-2px;right:24px;width:8px;height:8px;border-radius:4px;background:#ff3b30}
.dcard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:14px}
.dcard.hero{background:linear-gradient(135deg,#2a2d35,#14161b);color:#fff}.dcard.hero .muted{color:#aaa}.dcard.hot{border:2px solid #ff7a1a;cursor:pointer}.dcard.warn{background:#fff1f0;color:#c41f2c}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.sect{font-size:13px;color:#666;margin:12px 4px 6px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#eceef1;color:#555;margin-right:4px;font-weight:600;vertical-align:middle}
.tag.o{background:#fff0e3;color:#ff6a00}.tag.p{background:#f1e8ff;color:#8a4fd8}.tag.g{background:#e6f8ee;color:#139a50}.tag.r{background:#ffe8e6;color:#e33b2a}.tag.g2{background:#e6f6ec;color:#13a05a}
.btn{display:inline-block;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#eceef1;color:#222;font-family:inherit}
.btn.pri{background:#ff7a1a;color:#fff}.btn.wide{width:100%;margin-top:8px}.btn.big2{padding:14px;font-size:16px;border-radius:14px}.btn.dis{opacity:.35;pointer-events:none}.btn.dis2{background:#e6e6e6;color:#999}.btn.sm2{padding:4px 10px;font-size:12px}
.btn.buy{background:#e33b2a;color:#fff}.btn.sell{background:#1a8ad8;color:#fff}
.go{display:block;width:150px;height:150px;border-radius:75px;margin:18px auto 6px;border:none;background:radial-gradient(circle at 40% 35%,#ffa04a,#ff6a00);color:#fff;font-size:30px;font-weight:800;box-shadow:0 10px 30px rgba(255,106,0,.45),inset 0 -6px 0 rgba(0,0,0,.12);cursor:pointer;font-family:inherit}
.go small{display:block;font-size:12px;font-weight:500;opacity:.85}.go.off{background:radial-gradient(circle at 40% 35%,#666,#333);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.offer{position:absolute;inset:0;background:linear-gradient(180deg,#ff7a1a 0 30%,#f3f4f6 30%);padding:64px 16px 30px}
.offer>*{position:relative}.otop{margin-bottom:10px}.offer .otop .tag{background:rgba(255,255,255,.25);color:#fff}
.odist{color:#fff;font-size:20px;margin-bottom:16px}.odist b{font-size:42px}
.oroute{background:#fff;border-radius:16px;padding:16px;font-size:17px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.08)}.oroute.sm{background:none;box-shadow:none;padding:4px 0;font-size:14px}
.oroute .vline{width:2px;height:16px;background:#ddd;margin:2px 0 2px 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:middle}.dot.g{background:#21c065}.dot.o{background:#ff7a1a}
.ofare{font-size:26px;font-weight:800;color:#ff6a00}.ofare.sm{font-size:18px}
.obtns{position:absolute;left:16px;right:16px;bottom:34px;display:flex;gap:10px}.obtns .btn{padding:18px;font-size:17px;border-radius:16px}.obtns .btn.big{flex:1}
#offerCd{margin-left:8px;font-size:13px;opacity:.85}
.tmap{width:100%;border-radius:14px;display:block;margin-bottom:8px;background:#eee}
.nav{display:flex;align-items:center;gap:12px;background:#1d2330;color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px}.narr{font-size:40px;line-height:1;color:#5fc0ff}.nd{font-size:22px;font-weight:800}.nr{font-size:13px;opacity:.8}.neta{margin-left:auto;text-align:right;font-size:12px;opacity:.8}
.ddl{border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px;font-weight:700;background:#e6f8ee;color:#139a50}.ddl.warn{background:#fff4e0;color:#d98200}.ddl.late{background:#ffe8e6;color:#e33b2a}
.waitbar{height:6px;background:#eee;border-radius:3px;overflow:hidden}.waitbar div{height:100%;background:#ff7a1a}
.vtitle{font-size:17px;font-weight:800;margin:10px 0 8px;text-align:center}
.vbox{display:flex;gap:10px;justify-content:center;margin-bottom:12px}.vbox span{width:52px;height:60px;border-radius:12px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}.vbox span.f{border-color:#ff7a1a}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpad div{background:#f2f3f5;border-radius:12px;padding:12px 0;text-align:center;font-size:22px;font-weight:600;cursor:pointer}.kpad div:active{background:#ffd9bd}
.vwarn{background:#ffe8e6;color:#c41f2c;border-radius:12px;padding:12px;font-weight:700;text-align:center}
table.bill{width:100%;border-collapse:collapse;font-size:14px}table.bill td{padding:6px 2px;border-bottom:1px dashed #eee}table.bill td:last-child{text-align:right}table.bill tr.tot td{font-weight:800;font-size:16px}
.up2{color:#139a50}.dn2{color:#e33b2a}
.locked{padding:120px 20px;text-align:center;color:#555;font-size:20px;line-height:1.8}
/* 信息 */
.thread{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer;background:#fff}
.ava{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff;font-size:18px}
.bdg2{background:#ff3b30;color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.chat{background:#ededed;min-height:100%}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;margin:7px 0;line-height:1.5;background:#fff;font-size:14px;width:fit-content}
.bub.me{background:#95ec69;margin-left:auto}.bub .t{font-size:10px;color:#999;margin-top:2px}.acts{margin-top:8px;display:flex;gap:6px}
.relbar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:8px 0 4px}.relbar>div{height:100%;background:linear-gradient(90deg,#c9a0ff,#ff8ab0)}
.hist{font-size:12px;color:#555;line-height:1.8}
/* 银行 */
.bcard{background:linear-gradient(135deg,#d8333f,#8a0f1a);border-radius:18px;padding:18px;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px rgba(196,31,44,.3)}.bcard .w{color:rgba(255,255,255,.85)}.bcard .big{color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:14px;padding:12px 0;margin-bottom:10px}.bgrid div{text-align:center;font-size:12px;cursor:pointer}.bgrid span{display:block;font-size:22px;color:#c41f2c;margin-bottom:2px}
.seg{display:flex;background:#eceef1;border-radius:10px;padding:3px;margin-bottom:10px}.seg span{flex:1;text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#666}.seg span.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg span.on.buy{color:#e33b2a}.seg span.on.sell{color:#1a8ad8}.seg.sm{margin:4px 0 8px}.seg.in{display:inline-flex;margin:0;width:120px}
.amt{font-size:34px;font-weight:800;text-align:center;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips span{background:#f2f3f5;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
/* 同花顺 */
.app-ths{background:#f5f5f5!important}
.mst{font-size:11px!important;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:8px}.mst.on{background:#fff;color:#e33b2a}
.icard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}.bigi{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.chart{width:100%;display:block;margin-top:6px;border-radius:8px}
.up{color:#e33b2a}.dn{color:#13a05a}
.slist{background:#fff;border-radius:14px;overflow:hidden}
.srow{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;font-size:15px}.srow>div:nth-child(2),.srow>div:nth-child(3){text-align:right}
.srow.hd{font-size:12px;color:#999;cursor:default;padding:6px 14px}
.px{font-weight:700;font-variant-numeric:tabular-nums}.chip{justify-self:end;min-width:78px;text-align:center;border-radius:6px;padding:5px 0;color:#fff;font-weight:700;background:#999}.chip.up{background:#e33b2a;color:#fff}.chip.dn{background:#13a05a;color:#fff}
.link{color:#1a6ad8;cursor:pointer;font-size:13px}
.shead{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px}.bigp{font-size:34px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px;color:#888;margin-top:6px}.kv b{color:#222;font-weight:600}
.book{background:#fff;border-radius:14px;padding:8px 14px;margin:8px 0;font-size:13px}.book div{display:grid;grid-template-columns:40px 1fr 1fr;padding:2px 0}.book div span:last-child{text-align:right;color:#666}.book .bid:first-of-type{border-top:1px solid #eee}
.book div:nth-child(6){border-top:1px solid #eee;padding-top:4px}
.bs{position:sticky;bottom:70px}.bs .btn{flex:1;padding:14px;font-size:16px;border-radius:12px}
.pick{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.pick span{flex:none;background:#f2f3f5;border-radius:12px;padding:4px 10px;font-size:12px;cursor:pointer}.pick span.on{background:#ffe8e6;color:#e33b2a;font-weight:700}

.tmsg{margin-top:8px;padding:8px 10px;border-radius:8px;background:#e6f8ee;color:#139a50;font-size:13px}.tmsg.bad{background:#ffe8e6;color:#e33b2a}
.ord{font-size:12px;border-bottom:1px solid #f2f2f2;padding:5px 0}
.news{font-size:13px;line-height:1.6;cursor:pointer}
/* 模态 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:40}

.opt:hover{border-color:var(--acc)}.opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.opt.dis{opacity:.4;pointer-events:none}

.ctrls{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;color:#cfcfd2;margin:10px 0}

<body>

// ================= 工具 =================
const $=s=>document.querySelector(s);

const randi=(a,b)=>Math.floor(rand(a,b+1));

const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
function wpick(w){let s=0;for(const v of w)s+=v;let r=Math.random()*s;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i;}return w.length-1;}
let _seed=20261124;
function srand(){_seed|=0;_seed=_seed+0x6D2B79F5|0;let t=Math.imul(_seed^_seed>>>15,1|_seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}

const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=((Math.floor(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
const WD=['周一','周二','周三','周四','周五','周六','周日'];
const dayOf=t=>Math.floor(t/1440)+1;
const wdOf=t=>(4+Math.floor(t/1440))%7; // 第1天=周五

// ================= 城市常量 =================
const R=[-300,-200,-100,0,100,200,300], HW=7, LIM=307, KM=4;
const EW=['安顺路','延西路','长宁支路','新华路','梧桐路','复兴西路','桥西南路']; // z 固定，东西向
const NS=['武夷路','华山支路','乌鲁木齐路','常熟路','襄阳路','永福路','滨江路']; // x 固定，南北向
const ZK=['res','com','night'], ZI={res:0,com:1,night:2};
const ZN={res:'永安里住宅区',com:'常熟路商圈',night:'永福路酒吧街'};
const zoneOf=x=>{const i=clamp(Math.floor((x+300)/100),0,5);return i<2?'res':i<4?'com':'night';};
const nIdx=v=>clamp(Math.round((v+300)/100),0,6);

  home:{name:'永安里 · 家',spot:{x:-205,z:50}},
  shop:{name:'老陈面馆',spot:{x:-150,z:-5}},
  bar:{name:'退潮酒吧',spot:{x:195,z:-50}},
  linHome:{name:'梧桐路 · 弄堂口',spot:{x:-140,z:105}},

const PILLARS=[];for(let k=0;k<6;k++)PILLARS.push({x:-250+100*k,z:-200,r:1.3});
function onRoad(x,z,m){

  return Math.abs(x-R[nIdx(x)])<HW-m||Math.abs(z-R[nIdx(z)])<HW-m;
}
function legal(x,z){const m=1.1;if(!onRoad(x,z,m))return false;for(const p of PILLARS)if((x-p.x)**2+(z-p.z)**2<(p.r+m)**2)return false;return true;}
function sidewalkOf(p){ // 乘客站的人行道位置
  const ix=nIdx(p.x),iz=nIdx(p.z);
  if(Math.abs(p.x-R[ix])<HW&&Math.abs(p.z-R[iz])>=HW){const s=Math.sign(p.x-R[ix])||1;return{x:R[ix]+s*8.6,z:p.z};}
  const s=Math.sign(p.z-R[iz])||1;return{x:p.x,z:R[iz]+s*8.6};
}
function placeName(p){

  const ix=nIdx(p.x),iz=nIdx(p.z);
  if(Math.abs(p.z-R[iz])<HW)return EW[iz]+' · 近'+NS[nIdx(p.x)];
  return NS[ix]+' · 近'+EW[nIdx(p.z)];
}
function randRoadPoint(zone){
  for(let k=0;k<60;k++){
    const ew=Math.random()<.5,line=randi(0,6),seg=randi(0,5),a=R[seg]+rand(16,84),side=Math.random()<.5?1:-1;
    const p=ew?{x:a,z:R[line]+side*5}:{x:R[line]+side*5,z:a};
    if(Math.abs(p.x)>305||Math.abs(p.z)>305)continue;
    if(zone&&zoneOf(p.x)!==zone)continue;
    let bad=false;for(const q in PLACES)if(dist(p,PLACES[q].spot)<14)bad=true;if(bad)continue;
    return p;
  }
  return{x:5,z:50};
}

// ================= 导航寻路 =================
function anchors(p){
  const ix=nIdx(p.x),iz=nIdx(p.z),res=[];
  const onEW=Math.abs(p.z-R[iz])<HW+1,onNS=Math.abs(p.x-R[ix])<HW+1;
  if(onEW){const a=clamp(Math.floor((p.x+300)/100),0,5);for(const k of[a,a+1])res.push({i:k,j:iz,cost:Math.abs(p.x-R[k]),ax:'x'});}
  if(onNS){const a=clamp(Math.floor((p.z+300)/100),0,5);for(const k of[a,a+1])res.push({i:ix,j:k,cost:Math.abs(p.z-R[k]),ax:'z'});}
  if(!res.length)res.push({i:ix,j:iz,cost:Math.hypot(p.x-R[ix],p.z-R[iz]),ax:'x'});
  return res;
}
function routeLen(path){let L=0;for(let k=1;k<path.length;k++)L+=dist(path[k-1],path[k]);return L;}
function findRoute(from,to,heading){
  // 同一路段直达
  const ix=nIdx(from.x),iz=nIdx(from.z),tx=nIdx(to.x),tz=nIdx(to.z);
  if(Math.abs(from.z-R[iz])<HW&&Math.abs(to.z-R[tz])<HW&&iz===tz&&Math.floor((from.x+300)/100)===Math.floor((to.x+300)/100))return[{x:from.x,z:from.z},{x:to.x,z:to.z}];
  if(Math.abs(from.x-R[ix])<HW&&Math.abs(to.x-R[tx])<HW&&ix===tx&&Math.floor((from.z+300)/100)===Math.floor((to.z+300)/100))return[{x:from.x,z:from.z},{x:to.x,z:to.z}];
  let best=null;
  for(const a of anchors(from))for(const b of anchors(to)){
    let c=a.cost+Math.abs(a.i-b.i)*100+Math.abs(a.j-b.j)*100+b.cost;
    if(heading!==undefined){const fx=-Math.sin(heading),fz=-Math.cos(heading);const dx=R[a.i]-from.x,dz=R[a.j]-from.z;const L=Math.hypot(dx,dz)||1;if((dx*fx+dz*fz)/L<-.3&&L>8)c+=140;}
    if(!best||c<best.c)best={a,b,c};
  }
  const {a,b}=best,pts=[{x:from.x,z:from.z},{x:R[a.i],z:R[a.j]}];
  if(a.i!==b.i&&a.j!==b.j){ // L 形，优先沿原方向继续
    if(a.ax==='x')pts.push({x:R[b.i],z:R[a.j]});else pts.push({x:R[a.i],z:R[b.j]});
  }
  pts.push({x:R[b.i],z:R[b.j]},{x:to.x,z:to.z});
  const out=[];for(const p of pts){const l=out[out.length-1];if(!l||dist(l,p)>.5)out.push(p);}
  // 去掉共线点
  for(let k=out.length-2;k>0;k--){const p=out[k-1],q=out[k],r=out[k+1];const cr=(q.x-p.x)*(r.z-q.z)-(q.z-p.z)*(r.x-q.x);const dt=(q.x-p.x)*(r.x-q.x)+(q.z-p.z)*(r.z-q.z);if(Math.abs(cr)<1e-3&&dt>0)out.splice(k,1);}
  return out;
}
function segDist(p,a,b){const dx=b.x-a.x,dz=b.z-a.z,L2=dx*dx+dz*dz||1;let t=((p.x-a.x)*dx+(p.z-a.z)*dz)/L2;t=clamp(t,0,1);return{d:Math.hypot(p.x-a.x-t*dx,p.z-a.z-t*dz),t};}
function roadNameOfSeg(a,b){if(Math.abs(a.z-b.z)<1)return EW[nIdx(a.z)];if(Math.abs(a.x-b.x)<1)return NS[nIdx(a.x)];return'';}

const skyMat=new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vD;void main(){vD=normalize(position);vec4 p=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*p;gl_Position.z=gl_Position.w*.9999;}`,
  fragmentShader:`uniform vec3 top,hor,bot,sunDir,sunCol;uniform float night,time;varying vec3 vD;
  float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}
  void main(){vec3 d=normalize(vD);float y=d.y;vec3 c=y>0.?mix(hor,top,pow(clamp(y,0.,1.),.55)):mix(hor,bot,clamp(-y*4.,0.,1.));
   float s=max(dot(d,normalize(sunDir)),0.);c+=sunCol*(pow(s,900.)*14.+pow(s,12.)*.35)*(1.-night);
   vec3 md=normalize(-sunDir+vec3(.2,.3,0.));float m=max(dot(d,md),0.);c+=vec3(.9,.92,1.)*(smoothstep(.9994,.9996,m)*1.6+pow(m,60.)*.08)*night;

// 环境贴图：几个时段预烘焙，按时间切换
const pmrem=new THREE.PMREMGenerator(renderer);
function bakeEnv(top,hor,bot,sunDir,sunCol,night,cityGlow){
  const sc=new THREE.Scene();const m=skyMat.clone();m.uniforms=THREE.UniformsUtils.clone(skyU);
  m.uniforms.top.value.set(top);m.uniforms.hor.value.set(hor);m.uniforms.bot.value.set(bot);m.uniforms.sunDir.value.copy(sunDir);m.uniforms.sunCol.value.set(sunCol);m.uniforms.night.value=night;
  sc.add(new THREE.Mesh(new THREE.SphereGeometry(100,32,16),m));
  // 城市灯光在环境里的反射：一圈暖色/冷色亮块
  if(cityGlow){for(let k=0;k<40;k++){const a=k/40*Math.PI*2,b=new THREE.Mesh(new THREE.PlaneGeometry(rand(4,12),rand(2,9)),new THREE.MeshBasicMaterial({color:pick([0xffb860,0xffd9a0,0x9fd0ff,0xff5fae,0x6fe8ff]),side:THREE.DoubleSide}));b.material.color.multiplyScalar(cityGlow*rand(.6,1.6));b.position.set(Math.cos(a)*60,rand(-6,10),Math.sin(a)*60);b.lookAt(0,0,0);sc.add(b);}}
  else{for(let k=0;k<26;k++){const a=k/26*Math.PI*2,b=new THREE.Mesh(new THREE.PlaneGeometry(rand(8,20),rand(10,30)),new THREE.MeshBasicMaterial({color:new THREE.Color(bot).multiplyScalar(rand(.6,1.1)),side:THREE.DoubleSide}));b.position.set(Math.cos(a)*60,rand(0,12),Math.sin(a)*60);b.lookAt(0,0,0);sc.add(b);}}

}
const ENV={
  day:bakeEnv(0x4f86c6,0xd4e2ee,0x8a8780,new THREE.Vector3(.5,.8,.3),0xfff2d0,0,0),

const GEO={box:new THREE.BoxGeometry(1,1,1),sph:new THREE.SphereGeometry(1,20,14),cyl:new THREE.CylinderGeometry(1,1,1,20),plane:new THREE.PlaneGeometry(1,1)};
const _mc={};
function std(c,r=.8,m=0,extra){const k=c+'|'+r+'|'+m+(extra?JSON.stringify(extra):'');if(_mc[k])return _mc[k];const o=Object.assign({color:c,roughness:r,metalness:m},extra||{});return _mc[k]=new THREE.MeshStandardMaterial(o);}
const lam=c=>std(c,.85,0);
function bx(w,h,d,c,x,y,z,mat){const m=new THREE.Mesh(GEO.box,mat||std(c));m.scale.set(w,h,d);m.position.set(x,y,z);return m;}
function ctex(w,h,draw,rep,color=true){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=MAXANI;if(color)t.encoding=THREE.sRGBEncoding;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;}t.userData.canvas=c;return t;}
// 由灰度高度图生成法线贴图
function normalFromHeight(src,strength=2,rep=true){
  const w=src.width,h=src.height,g=src.getContext('2d'),d=g.getImageData(0,0,w,h).data;
  const c=document.createElement('canvas');c.width=w;c.height=h;const o=c.getContext('2d'),img=o.createImageData(w,h),od=img.data;
  const H=(x,y)=>d[(((y+h)%h)*w+((x+w)%w))*4]/255;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(H(x+1,y)-H(x-1,y))*strength,dy=(H(x,y+1)-H(x,y-1))*strength;const l=Math.hypot(dx,dy,1),i=(y*w+x)*4;od[i]=(-dx/l*.5+.5)*255;od[i+1]=(dy/l*.5+.5)*255;od[i+2]=(1/l*.5+.5)*255;od[i+3]=255;}
  o.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.anisotropy=MAXANI;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function canvasOf(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);return c;}
function texFromCanvas(c,rep,color=true){const t=new THREE.CanvasTexture(c);t.anisotropy=MAXANI;if(color)t.encoding=THREE.sRGBEncoding;if(rep)t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function noise(g,w,h,n,a,size=2){for(let k=0;k<n;k++){g.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,255,255'},${Math.random()*a})`;const s=Math.random()*size+1;g.fillRect(Math.random()*w,Math.random()*h,s,s);}}
// 合并几何（按材质批处理）
function mergeGeos(list){
  let nP=0,nI=0;for(const g of list){nP+=g.attributes.position.count;nI+=g.index?g.index.count:g.attributes.position.count;}
  const pos=new Float32Array(nP*3),nor=new Float32Array(nP*3),uv=new Float32Array(nP*2),idx=new Uint32Array(nI);let po=0,io=0;

    if(g.index){const a=g.index.array;for(let k=0;k<a.length;k++)idx[io+k]=a[k]+po;io+=a.length;}else{for(let k=0;k<c;k++)idx[io+k]=po+k;io+=c;}po+=c;}
  const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(pos,3));m.setAttribute('normal',new THREE.BufferAttribute(nor,3));m.setAttribute('uv',new THREE.BufferAttribute(uv,2));m.setIndex(new THREE.BufferAttribute(idx,1));m.computeBoundingSphere();m.computeBoundingBox();return m;
}
const BATCH=new Map();
function addB(mat,geo,cast=true){const k=mat.uuid+(cast?'c':'n');if(!BATCH.has(k))BATCH.set(k,{mat,cast,list:[]});BATCH.get(k).list.push(geo);}
// 按 100m 网格分块合并，便于视锥裁剪
function flushB(target){
  for(const{mat,cast,list}of BATCH.values()){const cells=new Map();
    for(const g of list){g.computeBoundingBox();const b=g.boundingBox,cx=Math.floor(((b.min.x+b.max.x)/2+400)/100),cz=Math.floor(((b.min.z+b.max.z)/2+400)/100),k=cx+','+cz;if(!cells.has(k))cells.set(k,[]);cells.get(k).push(g);}
    for(const arr of cells.values())for(let k=0;k<arr.length;k+=3000){const m=new THREE.Mesh(mergeGeos(arr.slice(k,k+3000)),mat);m.castShadow=cast;m.receiveShadow=true;target.add(m);}
  }BATCH.clear();
}
function boxG(w,h,d,x,y,z){const g=new THREE.BoxGeometry(w,h,d);g.translate(x,y,z);return g;}
function planeG(w,h,x,y,z,ry){const g=new THREE.PlaneGeometry(w,h);if(ry)g.rotateY(ry);g.translate(x,y,z);return g;}
// 圆角盒（用于车身、手机、内饰件）
function rboxG(w,h,d,r,seg=3){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;r=Math.min(r,w/2-.001,h/2-.001);
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  const b=Math.min(r*.6,d/2-.001);const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(.001,d-b*2),bevelEnabled:true,bevelThickness:b,bevelSize:b*.9,bevelSegments:seg,curveSegments:seg*2});

function bankNote(t){notify('bank','申城银行',t,true);}
// 司机钱包
function dwAdd(n,what){S.dw+=n;S.dtx.unshift({t:S.t,text:what,amt:n});}
// 通知：手机横幅 + 屏幕提示
function notify(app,title,text,quiet){const n={t:S.t,app,title,text};S.notes.unshift(n);if(S.notes.length>40)S.notes.pop();
  if(S.started&&!S.asleep){phoneBanner(n);if(!quiet)ping(660);}}
function msg(th,text,actions){const T=S.threads[th];T.hidden=false;const m={t:S.t,from:'them',text,actions:actions||null,done:false};T.msgs.push(m);
  if(!(UI.app==='msg'&&UI.thread===th))T.unread++;notify('msg',T.name,text);return m;}
function myMsg(th,text){S.threads[th].msgs.push({t:S.t,from:'me',text});}

// ================= 时间推进 =================
function hourOf(){return(S.t%1440)/60;}
const shiftKey=()=>Math.floor((S.t-360)/1440);
const linWorksNight=()=>wdOf(S.t-360)!==1; // 周二休息
function tickMinute(){
  S.t++;const m=S.t%1440;
  if(m===0&&!S.asleep)toast('新的一天 · '+dateStr(S.t));
  let drain=S.asleep?0:.035;
  if(S.loc==='car'&&Math.abs(car.speed)>2){drain+=.05;S.battery=Math.max(5,S.battery-.06);}
  if(S.order)drain+=.012;
  S.energy=Math.max(0,S.energy-drain);
  if(S.online&&S.wake)S.wake.onlineMin++;
  driverTick();economy();linTick();stockTick();
  if(!S.asleep){
    if(S.energy<25&&!S.warned.e25){S.warned.e25=1;toast('有点累了。可以吃点东西或回家休息。','warn');}
    if(S.energy<10&&!S.warned.e10){S.warned.e10=1;toast('眼皮在打架。再开下去不安全。','warn');}
    if(S.energy<=0&&S.loc==='car')passOut();
  }
  if(S.battery<15&&!S.warned.bat){S.warned.bat=1;toast('电量偏低（原型中充电未开放，睡觉时车行代充）','warn');}
}
function advance(mins){for(let k=0;k<mins;k++)tickMinute();}

// ================= 收支：车租 / 网贷 =================
function economy(){
  const r=S.rent;
  if(!r.overdue&&S.t===r.due-720)msg('chehang',`提醒：${whenStr(r.due)} 从尾号 6621 的银行卡代扣车租 ¥${r.amt}。当前卡内余额 ¥${Math.floor(S.cash)}${S.dw>0?`，司机钱包还有 ¥${S.dw.toFixed(2)} 未提现`:''}。`);
  if(!r.overdue&&S.t>=r.due){
    if(S.cash>=r.amt)payRent();
    else{r.overdue=true;r.since=S.t;msg('chehang',`车租 ¥${r.amt} 代扣失败，银行卡余额不足。请 24 小时内补缴，否则车辆会被远程限制接单。`);logEv('车租扣款失败');loanAd();}
  }
  if(r.overdue){
    if(S.t%60===0&&S.cash>=r.amt)payRent();
    else if(!S.locked&&S.t-r.since>=1440){S.locked=true;if(S.online)setOnline(false);msg('chehang','车租逾期超过 24 小时，车辆已限制接单。补缴后自动恢复。');logEv('车辆被限制接单');
      if(L.contact&&L.aff>=45&&!L.lent)msg('lin','听说你车被锁了？老陈说的。要是周转不开，跟我说一声。');}
  }
  if(!r.overdue&&S.cash+S.dw<80&&r.due-S.t<1080&&r.due-S.t>0&&S.t-S.loanOffered>1440)loanAd();
  const d=S.debt;
  if(d&&S.t>=d.due){
    if(S.cash>=d.amt){spend(d.amt,'秒借 自动还款');msg('loan',`已自动还款 ¥${d.amt}。期待再次为您服务。`);logEv('还清网贷');S.debt=null;}
    else{d.amt+=60;d.due+=1440;d.late++;msg('loan',d.late>1?`您的借款已逾期 ${d.late} 天，待还 ¥${d.amt}。我们将依约联系您的紧急联系人。`:`借款已逾期，产生逾期费 ¥60，待还 ¥${d.amt}。`);logEv('网贷逾期');}
  }
}
function payRent(){const r=S.rent;spend(r.amt,'车行代扣 · 车租（3 天）');bankNote(`代扣 ¥${r.amt} · 车行车租`);
  const was=r.overdue;r.overdue=false;S.locked=false;r.due+=r.period*1440;while(r.due<=S.t)r.due+=r.period*1440;
  msg('chehang',`${was?'已补缴':'已扣'}车租 ¥${r.amt}。下期 ${whenStr(r.due)}。`);logEv('支付车租 ¥'+r.amt);}
function loanAd(){S.loanOffered=S.t;msg('loan','急用钱？秒借 ¥500，最快 1 分钟到账，3 天后一次还清。',[{label:'借 ¥500',act:'loanTake'},{label:'不需要',act:'loanNo'}]);}
function passOut(){
  if(S.order)cancelOrder('司机长时间未移动，订单已改派。平台提醒：请勿疲劳驾驶。',-3);
  if(S.online)setOnline(false);car.speed=0;
  fadeTo('你在车里睡着了……',()=>{S.asleep=true;advance(240);S.asleep=false;S.energy=32;logEv('在车里累到睡着');toast('被交警敲窗叫醒。脖子很酸。','warn');S.warned.e25=S.warned.e10=0;});
}

// ================= 司机端：派单 / 抢单 / 预约 / 行程 =================
const SURN=['王','李','张','刘','陈','杨','黄','赵','周','吴','徐','孙','朱','马','胡','郭','林','何','高','罗'];
const tail4=()=>String(randi(0,9999)).padStart(4,'0');
function baseRate(h){if(h>=7&&h<9.5)return.17;if(h<11)return.09;if(h<14)return.11;if(h<17)return.08;if(h<20)return.16;if(h<23)return.12;if(h>=23||h<2.5)return.13;if(h<4.5)return.05;return.03;}
function zoneW(h){
  if(h>=7&&h<10)return{p:[.62,.28,.1],d:[.12,.78,.1]};
  if(h>=10&&h<17)return{p:[.25,.6,.15],d:[.4,.42,.18]};
  if(h>=17&&h<20)return{p:[.2,.6,.2],d:[.55,.2,.25]};
  if(h>=20&&h<23)return{p:[.15,.4,.45],d:[.35,.25,.4]};
  if(h>=23||h<4.5)return{p:[.08,.17,.75],d:[.75,.17,.08]};
  return{p:[.5,.3,.2],d:[.3,.5,.2]};
}
const isNight=t=>{const h=(t%1440)/60;return h>=23||h<5;};
// 快车计价：起步 ¥14（含 3 公里），里程 2.5/km（夜间 3.0），时长 0.5/分钟，15 公里以上远途费 1/km
function fareOf(km,min,t,extra=0){const night=isNight(t),base=14,dist=Math.max(0,km-3)*(night?3:2.5),dur=min*.5,far=Math.max(0,km-15)*1;
  const total=Math.round((base+dist+dur+far+extra)*100)/100;return{base,dist:Math.round(dist*100)/100,dur:Math.round(dur*100)/100,far:Math.round(far*100)/100,extra,total,night};}
const FEE_RATE=.2;
function estMinutes(len){return Math.ceil(len/8.5);}
function mkOrder(type,pickup,drop,extra={}){
  const far=drop===PLACES.exit.spot;
  const path=findRoute(pickup,drop),len=routeLen(path),km=far?rand(18,22):len*KM/1000;
  const appr=routeLen(findRoute(car,pickup,car.h));
  const tripMin=far?42:estMinutes(len);const est=fareOf(km,tripMin,S.t,extra.bonus||0);
  const o={id:Math.random().toString(36).slice(2,8),type,pickup,drop,far,len,km,appr,apprKm:appr*KM/1000,tripMin,
    pickName:placeName(pickup),dropName:far?PLACES.exit.name:placeName(drop),est:est.total,estNet:Math.round(est.total*(extra.private?1:1-FEE_RATE)*100)/100,
    tail:extra.tail||tail4(),pName:(extra.pName||pick(SURN)+pick(['先生','女士'])),npc:extra.npc||null,kind:extra.kind||null,private:!!extra.private,bonus:extra.bonus||0,
    expire:15,comp:extra.comp||0,resvT:extra.resvT||null,wrong:!extra.npc&&!extra.private&&Math.random()<.08,noShow:!extra.npc&&Math.random()<.04,
    tag:extra.tag||(far?'远途':(isNight(S.t)&&zoneOf(pickup.x)==='night')?'夜场':''),bumps:0};
  return o;
}
// ---- 实时派单 ----
function maybeOffer(){
  const h=hourOf(),zw=zoneW(h);let rate=baseRate(h)*(.55+zw.p[ZI[zoneOf(car.x)]]*1.3)*(.6+S.score/200);
  if(S.energy<15)rate*=.5;
  if(S.queue.some(r=>r.resvT-S.t<40))return;
  if(Math.random()>rate)return;
  const lo=linOffer();if(lo){setOffer(lo);return;}
  const far=(h>=19||h<2||(h>=6.5&&h<10))&&Math.random()<.08;
  let best=null;for(let k=0;k<26;k++){const p=randRoadPoint(ZK[wpick(zw.p)]);const d=dist(p,car);if(d<50)continue;const sc=d+rand(0,160);if(!best||sc<best.s)best={p,s:sc};}
  if(!best)return;
  let drop;if(far)drop=PLACES.exit.spot;else for(let k=0;k<30;k++){drop=randRoadPoint(ZK[wpick(zw.d)]);if(dist(drop,best.p)>200)break;}
  setOffer(mkOrder('rt',best.p,drop));
}
function setOffer(o){S.offer=o;voice('您有新的订单');ping(988,.18);ping(1318,.18,.12);openApp('didi','home',true);}
function acceptOffer(){const o=S.offer;if(!o)return;S.offer=null;S.stats.accepted++;startOrder(o);}
function skipOffer(){if(!S.offer)return;S.offer=null;S.offerCd=5;S.stats.skipped++;renderPhone(true);}
function startOrder(o){
  o.phase='toPickup';o.acceptT=S.t;o.pickDdl=o.resvT?o.resvT+10:S.t+estMinutes(o.appr)+4;S.order=o;
  const sw=sidewalkOf(o.pickup);
  o.pMesh=o.npc==='lin'?makeLin():makePerson();o.pMesh.position.set(sw.x,.15,sw.z);o.pMesh.lookAt(o.pickup.x,.15,o.pickup.z);scene.add(o.pMesh);
  if(o.npc==='lin')L.rideShift=shiftKey();
  mkPick.position.set(o.pickup.x,0,o.pickup.z);mkPick.visible=true;mkDrop.visible=false;
  setRoute(o.pickup);voice(o.resvT?'预约行程开始，请前往上车点':'请前往上车点接乘客');openApp('didi','trip',true);ping(784);
}
function cancelOrder(why,sd=0){const o=S.order;if(!o)return;if(o.pMesh)scene.remove(o.pMesh);if(o.wMesh)scene.remove(o.wMesh);clearRearPax();S.order=null;mkPick.visible=mkDrop.visible=false;setRoute(null);
  notify('didi','滴滴车主',why);if(sd){S.score=clamp(S.score+sd,60,100);}if(o.npc==='lin'&&o.phase==='toPickup'){addAff(-4);linHist('没接上她');}ride=null;S.offerCd=4;activateQueued();renderPhone(true);}
// ---- 抢单大厅 ----
function hallRefresh(){
  S.hall=S.hall.filter(o=>!o.gone&&(o.resvT?o.resvT-S.t>50:S.t-o.born<14));
  const h=hourOf(),zw=zoneW(h);
  while(S.hall.length<5){
    let o;
    if(Math.random()<.35){const T=S.t+randi(90,720);const tt=Math.round(T/10)*10;const toAir=Math.random()<.5;const p=randRoadPoint(ZK[randi(0,2)]);
      o=mkOrder('resv',p,toAir?PLACES.exit.spot:randRoadPoint(ZK[randi(0,2)]),{resvT:tt,bonus:toAir?0:3,comp:randi(1,6)});o.tag='预约';}
    else{const p=randRoadPoint(ZK[wpick(zw.p)]);let d;for(let k=0;k<20;k++){d=randRoadPoint(ZK[wpick(zw.d)]);if(dist(d,p)>220)break;}
      o=mkOrder('grab',p,d,{bonus:randi(2,8),comp:randi(2,9)});o.tag='抢单';}
    o.born=S.t;S.hall.push(o);
  }
  S.hall.sort((a,b)=>(a.resvT||0)-(b.resvT||0));
}
function grabChance(o){const near=o.resvT?.15:clamp(1-o.apprKm/3,0,1)*.3;return clamp(.18+(S.score-70)/55+near-o.comp*.03,.08,.92);}
function grab(id){
  const o=S.hall.find(x=>x.id===id);if(!o||o.grabbing)return;
  if(!o.resvT&&S.order){toast('当前有进行中的订单，只能抢预约单','warn');return;}
  if(o.resvT&&S.queue.some(r=>Math.abs(r.resvT-o.resvT)<90)){toast('与已有预约时间冲突','warn');return;}
  o.grabbing=true;renderPhone(true);
  setTimeout(()=>{o.grabbing=false;o.gone=true;S.hall=S.hall.filter(x=>x!==o);
    if(Math.random()<grabChance(o)){ching();S.stats.accepted++;
      if(o.resvT){S.queue.push(o);S.queue.sort((a,b)=>a.resvT-b.resvT);notify('didi','滴滴车主',`抢单成功：${whenStr(o.resvT)} ${o.pickName} → ${o.dropName}`);logEv('抢到预约单 '+whenStr(o.resvT));}
      else{notify('didi','滴滴车主','抢单成功，请尽快前往上车点');startOrder(o);}}
    else{thud();notify('didi','滴滴车主','手慢了，订单已被其他司机抢走');}
    renderPhone(true);},1200);
}
function activateQueued(){if(S.order||!S.queue.length)return;const r=S.queue[0];if(S.t>=r.resvT-25){S.queue.shift();r.acceptT=S.t;startOrder(r);}}
// ---- 每分钟 ----
function driverTick(){
  if(S.online&&!S.order&&!S.offer&&!S.locked&&S.offerCd<=0&&S.loc==='car')maybeOffer();
  if(S.online&&S.t-S.hallT>=8){S.hallT=S.t;hallRefresh();}
  for(const r of S.queue.slice()){
    if(r.resvT-S.t===60)notify('didi','滴滴车主',`预约提醒：1 小时后 ${fmt(r.resvT)} 在 ${r.pickName} 接 ${r.pName}`);
    if(S.t>r.resvT+10){S.queue.splice(S.queue.indexOf(r),1);S.score=clamp(S.score-5,60,100);dwAdd(-20,'预约单爽约 违约金');notify('didi','滴滴车主',`你错过了 ${fmt(r.resvT)} 的预约单，服务分 -5，违约金 ¥20`);logEv('预约单爽约');}
  }
  activateQueued();
  const o=S.order;
  if(o&&o.phase==='toPickup'){
    if(S.t===o.pickDdl-3)voice('距离接驾截止还有 3 分钟');
    if(S.t>o.pickDdl+12)cancelOrder('司机迟到过久，乘客已取消订单。服务分 -2',-2);
  }
  if(o&&o.phase==='waiting'&&o.noShow&&S.t-o.arriveT>=5&&!o.noShowReady){o.noShowReady=true;notify('didi','滴滴车主','乘客超过 5 分钟未上车，可免责取消并获得等候费');}
  if(o&&o.phase==='toDrop'&&S.t===o.dropDdl)voice('已超过预计送达时间');
}
function setOnline(v){
  if(v&&S.locked){toast('车辆已被车行限制接单，先补缴车租。','warn');return;}
  if(v&&S.loc!=='car')return;
  S.online=v;if(!v){S.offer=null;}else{S.offerCd=2;S.hallT=S.t;hallRefresh();}
  voice(v?'开始听单':'已收车');renderPhone(true);
}
// ---- 行程流程 ----
const PLINES={day:['师傅，走高架下面那条，快一点。','麻烦空调开小一点，谢谢。','（乘客一直在打电话，说的是方案和报价）','你好，到地铁站附近放我下来也行。','这边新开了家咖啡店，你喝过吗？'],
  night:['（乘客戴上耳机，一路没说话）','师傅辛苦，这么晚还在跑。','开慢点没事，我有点晕。','刚加完班……这周第四天了。','这条路晚上挺安静的。']};
let rearPax=null;
function clearRearPax(){if(rearPax){carG.remove(rearPax);rearPax=null;}}
function arrivePickup(){
  const o=S.order;o.phase='waiting';o.arriveT=S.t;mkPick.visible=false;setRoute(null);
  const late=S.t-o.pickDdl;if(late>0){S.stats.late++;S.score=clamp(S.score-1,60,100);o.lateP=late;notify('didi','滴滴车主',`接驾迟到 ${late} 分钟，服务分 -1`);}
  voice('已到达上车点，请等待乘客');
  if(!o.noShow){o.walk=o.wrong?'wrong':'pax';if(o.wrong){o.wMesh=makePerson();o.wMesh.position.copy(o.pMesh.position).add(new THREE.Vector3(1.2,0,1.2));scene.add(o.wMesh);}}
  openApp('didi','trip',true);
}
function paxWalk(dt){const o=S.order;if(!o||o.phase!=='waiting'||!o.walk)return;
  const m=o.walk==='wrong'?o.wMesh:o.pMesh;if(!m)return;
  const door=new THREE.Vector3(1.05,0,.95).applyAxisAngle(_Y,car.h).add(new THREE.Vector3(car.x,.15,car.z));
  const d=m.position.distanceTo(door);
  if(d>.5){const v=door.clone().sub(m.position).setY(0).normalize();m.position.addScaledVector(v,Math.min(d,1.5*dt));m.rotation.y=Math.atan2(-v.x,-v.z);animPerson(m,dt,true);}
  else{scene.remove(m);door2();o.walk=null;
    o.onBoard=m===o.wMesh?'wrong':'pax';
    rearPax=o.npc==='lin'&&o.onBoard==='pax'?makeLin(true):makePerson({seated:true});
    rearPax.position.copy(rearSeatSpot);rearPax.position.y=.12;carG.add(rearPax);
    o.phase='verify';UI.keypad='';o.saidTail=o.onBoard==='wrong'?tail4():o.tail;
    const who=o.npc==='lin'&&o.onBoard==='pax'?(L.met?'林晚':'乘客'):'乘客';
    showDlg(who,(o.npc==='lin'&&!L.met)?'（后门拉开）师傅，尾号 '+o.saidTail+'。':pick(['你好，尾号 ','师傅好，手机尾号 ','尾号 '])+o.saidTail+'。',null,7);
    voice('请核对乘客手机尾号');openApp('didi','trip',true);}
}
function verifyTail(code){
  const o=S.order;if(!o||o.phase!=='verify')return;
  if(code===o.tail){
    if(o.onBoard==='wrong'){o.mismatch=true;renderPhone(true);return;}
    o.phase='toDrop';o.pickT=S.t;o.dropDdl=S.t+o.tripMin+4;mkDrop.position.set(o.drop.x,0,o.drop.z);mkDrop.visible=true;setRoute(o.drop);
    voice('行程开始，请系好安全带');
    if(o.npc==='lin')linRideStart(o);else if(!UI.dlg)showDlg('乘客',pick(NIGHT>.5?PLINES.night:PLINES.day),null,5);
  }else{o.mismatch=true;toast('尾号不符，请确认乘客身份','warn');thud();}
  UI.keypad='';renderPhone(true);
}
function wrongPaxOut(){const o=S.order;if(!o)return;o.mismatch=false;clearRearPax();door2();
  if(o.onBoard==='wrong'){showDlg('乘客','啊？不好意思不好意思，我叫的是另一辆白车……',null,4);o.wrong=false;o.walk='pax';o.phase='waiting';
    const p=makePerson();p.position.copy(sidewalkOf({x:car.x,z:car.z})).setY(.15);scene.add(p);setTimeout(()=>scene.remove(p),8000);}
  else{showDlg('乘客','尾号就是 '+o.tail+' 啊，你再看看？',null,4);o.phase='verify';rearPax=makePerson({seated:true});rearPax.position.copy(rearSeatSpot);rearPax.position.y=.12;carG.add(rearPax);}
  renderPhone(true);}
function noShowCancel(){const o=S.order;if(!o||!o.noShowReady)return;dwAdd(6,'乘客未上车 等候费');S.order=null;if(o.pMesh)scene.remove(o.pMesh);setRoute(null);notify('didi','滴滴车主','订单已免责取消，等候费 ¥6 已到账');S.offerCd=3;activateQueued();renderPhone(true);}
function arriveDrop(){
  const o=S.order;o.phase='settle';o.dropT=S.t;mkDrop.visible=false;setRoute(null);
  const min=Math.max(1,o.dropT-o.pickT),km=o.far?o.km:Math.max(.5,o.km);o.bill=fareOf(km,o.far?o.tripMin:min,o.pickT,o.bonus);
  o.fee=o.private?0:Math.round(o.bill.total*FEE_RATE*100)/100;o.net=Math.round((o.bill.total-o.fee)*100)/100;
  let stars=5;if(o.lateP>3)stars--;if(S.t>o.dropDdl)stars--;stars-=Math.min(2,o.bumps);if(o.npc==='lin')stars=5;o.stars=clamp(stars,1,5);
  voice('已到达目的地，请提醒乘客带好随身物品');door2();clearRearPax();
  const sw=sidewalkOf(o.drop);const p=o.npc==='lin'?makeLin():makePerson();p.position.set(sw.x,.15,sw.z);scene.add(p);setTimeout(()=>scene.remove(p),9000);
  if(o.npc==='lin')linRideEnd(o);

function placeOrder(code,side,px,qty,market){
  const s=SBY[code],st=mState();qty=Math.floor(qty/100)*100;
  if(qty<=0)return err('数量至少 1 手（100 股）');
  if(s.susp)return err('该股票停牌中，无法交易');
  if(st==='closeAuction')return err('收盘集合竞价阶段不接受新委托（原型简化）');
  px=market?(side==='buy'?limUp(s):limDn(s)):r2(px);
  if(!market&&(px>limUp(s)||px<limDn(s)))return err(`委托价超出涨跌停范围 ${limDn(s).toFixed(2)}–${limUp(s).toFixed(2)}`);
  const preset=st==='closed'||st==='weekend'||st==='pre';
  if(side==='buy'){const need=r2(qty*px+fees('buy',qty*px));if(SEC.cash<need)return err(`可用资金不足，需要 ¥${need.toFixed(2)}`);SEC.cash=r2(SEC.cash-need);SEC.frozen=r2(SEC.frozen+need);
    var o={id:MK.seq++,code,side,px,qty,filled:0,frz:need,t:S.t,status:preset?'preset':'open',market};}
  else{const p=SEC.pos[code];if(!p||p.avail<qty)return err(p&&p.qty>p.avail?'今日买入的股票需下一交易日才能卖出（T+1）':'可卖数量不足');p.avail-=qty;
    var o={id:MK.seq++,code,side,px,qty,filled:0,t:S.t,status:preset?'preset':'open',market};}
  MK.orders.unshift(o);if(preset)SEC.preset.push(o);
  if(!preset&&(st==='cont'))matchOrder(o,false);
  return{ok:true,msg:preset?`已提交预埋单，将于 ${nextOpenStr().replace('09:30','09:15')} 报入`:(o.status==='filled'?'委托已成交':'委托已报，等待成交')};
}
function err(m){return{ok:false,msg:m};}
function cancelOrder2(id){const o=MK.orders.find(x=>x.id===id);if(!o||(o.status!=='open'&&o.status!=='preset'))return;if(mState()==='closeAuction'||mState()==='quiet'){toast('当前阶段不可撤单','warn');return;}
  o.status='canceled';unfreeze(o);SEC.preset=SEC.preset.filter(x=>x!==o);}
function unfreeze(o){if(o.side==='buy'){SEC.frozen=r2(SEC.frozen-o.frz);SEC.cash=r2(SEC.cash+o.frz);o.frz=0;}else{const p=SEC.pos[o.code];if(p)p.avail+=o.qty-o.filled;}}
function matchAll(auction){for(const o of MK.orders)if(o.status==='open')matchOrder(o,auction);}
function matchOrder(o,auction){const s=SBY[o.code];if(s.susp)return;
  if(o.side==='buy'){if(s.px>o.px)return;if(s.seal===1&&Math.random()>(o.code==='002413'&&MK.pumpDay!==null?.18:.05))return;fill(o,s.px);}
  else{if(s.px<o.px)return;if(s.seal===-1&&Math.random()>(s.hard?.002:.03))return;fill(o,s.px);}}
function fill(o,px){const s=SBY[o.code],amt=r2(px*o.qty),fee=fees(o.side,amt);o.status='filled';o.fpx=px;o.filled=o.qty;o.fee=fee;
  if(o.side==='buy'){SEC.frozen=r2(SEC.frozen-o.frz);SEC.cash=r2(SEC.cash+o.frz-amt-fee);o.frz=0;const p=SEC.pos[o.code]||(SEC.pos[o.code]={qty:0,avail:0,cost:0});p.cost=r2((p.cost*p.qty+amt+fee)/(p.qty+o.qty)*1000)/1000;p.qty+=o.qty;}
  else{const p=SEC.pos[o.code];SEC.cash=r2(SEC.cash+amt-fee);const realized=r2(amt-fee-p.cost*o.qty);o.pnl=realized;p.qty-=o.qty;if(p.qty<=0)delete SEC.pos[o.code];logEv(`卖出 ${s.n} ${o.qty} 股，盈亏 ${realized>=0?'+':''}${realized.toFixed(0)}`);}
  MK.trades.unshift({t:S.t,code:o.code,n:s.n,side:o.side,px,qty:o.qty,fee});
  thsNote('委托成交',`${o.side==='buy'?'买入':'卖出'} ${s.n} ${o.qty} 股 @ ${px.toFixed(2)}`);
}

// ---- 小地图（共用）----
function drawMiniTo(g,W,H,dark){
  const span=260,sc=Math.min(W,H)/span,cx=car.x,cz=car.z,P=(x,z)=>[W/2+(x-cx)*sc,H*.58+(z-cz)*sc];
  g.save();g.fillStyle=dark?'#141820':'#eef0f2';g.fillRect(0,0,W,H);
  g.translate(W/2,H*.58);g.rotate(car.h);g.translate(-W/2,-H*.58);
  for(let i=0;i<6;i++)for(let j=0;j<6;j++){const zo=i<2?0:i<4?1:2;g.fillStyle=dark?['#22252b','#1f2430','#272231'][zo]:['#e2ddd2','#dde3ea','#e6dde8'][zo];const[a,b]=P(-293+100*i,-293+100*j);g.fillRect(a,b,86*sc,86*sc);}
  g.fillStyle=dark?'#14303c':'#a9cfe0';const[rx]=P(320,0);g.fillRect(rx,-H,4000,H*3);
  g.strokeStyle=dark?'#3a3f49':'#ffffff';g.lineWidth=13*sc;g.lineCap='butt';for(const r of R){let[a,b]=P(-310,r),[c,d]=P(310,r);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();[a,b]=P(r,-310);[c,d]=P(r,310);g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke();}
  if(ROUTE){g.strokeStyle='#1fa3ff';g.lineWidth=Math.max(5,6*sc);g.lineJoin='round';g.beginPath();ROUTE.forEach((p,k)=>{const[a,b]=P(p.x,p.z);k?g.lineTo(a,b):g.moveTo(a,b);});g.stroke();}
  g.font=`bold ${Math.round(16*sc*1.2)}px sans-serif`;g.textAlign='center';g.textBaseline='middle';
  for(const[k,t,c]of[['shop','面','#ff6a4f'],['home','家','#4f8fff'],['bar','酒','#a96aff']]){const[a,b]=P(PLACES[k].spot.x,PLACES[k].spot.z);g.fillStyle=c;g.beginPath();g.arc(a,b,10*sc*1.3,0,7);g.fill();g.fillStyle='#fff';g.fillText(t,a,b+1);}
  if(S.order){const o=S.order;for(const[p,c,show]of[[o.pickup,'#21c065',o.phase==='toPickup'],[o.drop,'#ff7a1a',o.phase!=='settle']]){if(!show)continue;const[a,b]=P(p.x,p.z);g.fillStyle=c;g.beginPath();g.arc(a,b,9,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();}}
  g.restore();

  let hi=up||prev*1.02,lo=dn||prev*.98;if(isIdx){for(const v of data){hi=Math.max(hi,v);lo=Math.min(lo,v);}const pad=(hi-lo)*.1;hi+=pad;lo-=pad;}
  else if(data.length){let mx=0;for(const v of data)mx=Math.max(mx,Math.abs(v-prev));const span=Math.max(mx*1.15,prev*.01);hi=prev+span;lo=prev-span;}
  const Y=v=>H-(v-lo)/(hi-lo)*H,X=i=>i/240*W;
  g.strokeStyle='#eee';g.lineWidth=1;for(let k=1;k<4;k++){g.beginPath();g.moveTo(0,H*k/4);g.lineTo(W,H*k/4);g.stroke();g.beginPath();g.moveTo(W*k/4,0);g.lineTo(W*k/4,H);g.stroke();}
  g.setLineDash([6,4]);g.strokeStyle='#bbb';g.beginPath();g.moveTo(0,Y(prev));g.lineTo(W,Y(prev));g.stroke();g.setLineDash([]);
  if(data.length){const last=data[data.length-1],col=last>=prev?'#e8392a':'#13a05a';
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,col+'40');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.beginPath();g.moveTo(0,H);data.forEach((v,i)=>g.lineTo(X(i),Y(v)));g.lineTo(X(data.length-1),H);g.fill();
    g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();data.forEach((v,i)=>i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v)));g.stroke();
    if(!isIdx){let s=0;g.strokeStyle='#f0a020';g.lineWidth=1.5;g.beginPath();data.forEach((v,i)=>{s+=v;const a=s/(i+1);i?g.lineTo(X(i),Y(a)):g.moveTo(X(i),Y(a));});g.stroke();}}
  g.fillStyle='#999';g.font='20px Arial';g.fillText(hi.toFixed(2),4,20);g.fillText(lo.toFixed(2),4,H-6);g.textAlign='right';g.fillText('15:00',W-4,H-6);g.textAlign='left';
}
function kChart(cv,s){const g=cv.getContext('2d'),W=cv.width,H=cv.height;g.fillStyle='#fff';g.fillRect(0,0,W,H);
  const k=s.k.slice(-40);if(!k.length)return;let hi=-1e9,lo=1e9;for(const d of k){hi=Math.max(hi,d.h);lo=Math.min(lo,d.l);}const Y=v=>8+(hi-v)/(hi-lo)*(H-16),bw=W/k.length;
  k.forEach((d,i)=>{const up=d.c>=d.o,col=up?'#e8392a':'#13a05a';g.strokeStyle=g.fillStyle=col;const x=i*bw+bw/2;g.beginPath();g.moveTo(x,Y(d.h));g.lineTo(x,Y(d.l));g.stroke();
    const y1=Y(Math.max(d.o,d.c)),y2=Y(Math.min(d.o,d.c));if(up){g.lineWidth=1.5;g.strokeRect(x-bw*.35,y1,bw*.7,Math.max(1,y2-y1));}else g.fillRect(x-bw*.35,y1,bw*.7,Math.max(1,y2-y1));});
  for(const[n,c]of[[5,'#f0a020'],[10,'#3a7bd5']]){g.strokeStyle=c;g.lineWidth=1.5;g.beginPath();let st=false;k.forEach((d,i)=>{const all=s.k.slice(0,s.k.length-k.length+i+1);if(all.length<n)return;const a=all.slice(-n).reduce((x,y)=>x+y.c,0)/n;const x=i*bw+bw/2;st?g.lineTo(x,Y(a)):g.moveTo(x,Y(a));st=true;});g.stroke();}
  g.fillStyle='#999';g.font='20px Arial';g.fillText(hi.toFixed(2),4,22);g.fillText(lo.toFixed(2),4,H-6);}

function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();
  engO=AC.createOscillator();engO.type='sawtooth';engO2=AC.createOscillator();engO2.type='sine';const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420;engG=AC.createGain();engG.gain.value=0;engO.connect(f);engO2.connect(f);f.connect(engG).connect(AC.destination);engO.start();engO2.start();
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;for(let k=0;k<len;k++){last=(last+(Math.random()*2-1)*.06)*.985;d[k]=last*4;}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;nzF=AC.createBiquadFilter();nzF.type='lowpass';nzF.frequency.value=300;nzG=AC.createGain();nzG.gain.value=0;src.connect(nzF).connect(nzG).connect(AC.destination);src.start();}catch(e){AC=null;}}

function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]];}
function mmm(a,b){const c=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++){let s=0;for(let k=0;k<3;k++)s+=a[3*i+k]*b[3*k+j];c[3*i+j]=s;}return c;}
function mmv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]];}

  for(let k=0;k<4;k++){_pc[k].set(loc[k][0],loc[k][1],.0007);phoneScreen.localToWorld(_pc[k].set(loc[k][0],loc[k][1],0));_pc[k].project(camera);if(_pc[k].z>1)behind=true;dst.push((_pc[k].x+1)/2*innerWidth,(1-_pc[k].y)/2*innerHeight);}
  if(behind){el.style.visibility='hidden';return;}el.style.visibility='visible';
  const t=proj2d([0,0,W,0,0,H,W,H],dst);for(let k=0;k<9;k++)t[k]/=t[8];
  el.style.transform=`matrix3d(${t[0]},${t[3]},0,${t[6]},${t[1]},${t[4]},0,${t[7]},0,0,1,0,${t[2]},${t[5]},0,${t[8]})`;
}
const _pv=new THREE.Vector3();
function glanceTarget(){mountG.updateMatrixWorld(true);_pv.set(0,0,0);phoneScreen.localToWorld(_pv);carG.worldToLocal(_pv);_pv.sub(head.position);return{yaw:Math.atan2(-_pv.x,-_pv.z),pitch:Math.atan2(_pv.y,Math.hypot(_pv.x,_pv.z))};}

// ================= 驾驶 =================
function drive(dt){
  let thr=0,brk=0;const v0=car.speed;
  if(keys.w)thr=1;
  if(keys.s){if(car.speed>.5)brk=1;else thr=-1;}
  if(UI.modal){thr=0;brk=1;}
  if(thr>0)car.speed+=(car.speed<0?9:3.6*(1-car.speed/17.5))*dt;
  else if(thr<0)car.speed-=2.6*(1+car.speed/5)*dt;
  if(brk){const s=Math.sign(car.speed);car.speed-=s*8.5*dt;if(Math.sign(car.speed)!==s)car.speed=0;}
  if(keys.space){const s=Math.sign(car.speed);car.speed-=s*12*dt;if(Math.sign(car.speed)!==s)car.speed=0;}
  if(!thr&&!brk)car.speed*=1-.25*dt;
  if(Math.abs(car.speed)<.04&&!thr)car.speed=0;
  let target=(keys.a?1:0)-(keys.d?1:0);
  if(S.energy<8)target+=Math.sin(performance.now()/700)*.35;
  const sm=.62/(1+Math.abs(car.speed)*.08);
  car.steer+=(target*sm-car.steer)*Math.min(1,dt*(target?3.2:5));
  car.h+=car.speed/2.75*Math.tan(car.steer)*dt;
  const fx=-Math.sin(car.h),fz=-Math.cos(car.h),nx=car.x+fx*car.speed*dt,nz=car.z+fz*car.speed*dt;
  if(legal(nx,nz)){car.x=nx;car.z=nz;}
  else if(legal(nx,car.z)){car.x=nx;car.speed*=.97;if(Math.abs(car.speed)>7)bump();}
  else if(legal(car.x,nz)){car.z=nz;car.speed*=.97;if(Math.abs(car.speed)>7)bump();}
  else{if(Math.abs(car.speed)>3)bump('撞上了路沿');car.speed*=-.2;}
  car.accel=lerp(car.accel,(car.speed-v0)/Math.max(dt,1e-3),Math.min(1,dt*4));
}
let glanceK=0;
function placeCar(dt){
  const lat=car.speed*car.speed/2.75*Math.tan(car.steer);
  car.pitch=lerp(car.pitch,clamp(-car.accel*.004,-.03,.03),Math.min(1,dt*5));car.roll=lerp(car.roll,clamp(lat*.0016,-.035,.035),Math.min(1,dt*4));
  car.shake=Math.max(0,car.shake-dt*2.5);
  const tm=performance.now()/1000,vib=Math.min(1,Math.abs(car.speed)/14),road=(Math.sin(tm*31)*.5+Math.sin(tm*47.3)*.3+Math.sin(tm*13.1)*.6)*.0012*vib;
  carG.position.set(car.x,road+car.shake*.02*Math.sin(tm*60),car.z);carG.rotation.set(car.pitch,car.h,car.roll);
  wheelSpin.rotation.z=car.steer*3.4;
  // 头部：惯性前后倾、转弯侧倾
  head.position.set(EYE.x-clamp(lat*.004,-.05,.05),EYE.y+road*.6+car.shake*.015*Math.sin(tm*45),EYE.z+clamp(car.accel*.006,-.05,.04));
  const g=UI.phone==='glance';glanceK=lerp(glanceK,g?1:0,Math.min(1,dt*7));
  if(!drag&&!g){car.lookYaw*=1-Math.min(1,dt*3);car.lookPitch*=1-Math.min(1,dt*3);}
  const into=clamp(car.steer*Math.min(1,Math.abs(car.speed)/6)*.55,-.35,.35);
  const gt=glanceTarget();
  const yaw=lerp(car.lookYaw+into,gt.yaw,glanceK),pitch=lerp(car.lookPitch-.045,gt.pitch,glanceK);
  camera.rotation.set(pitch,yaw,-car.roll*.4);
  const fov=lerp(62,16,glanceK);if(Math.abs(camera.fov-fov)>.01){camera.fov=fov;camera.updateProjectionMatrix();}
}

// ================= 主循环 =================
let last=performance.now(),clusterT=0,ccT=0,mirT=0,frame=0;
function update(dt){
  if(S.started&&!UI.modal&&!fading){S.acc+=dt*S.ts;while(S.acc>=1){S.acc-=1;tickMinute();}}
  if(S.loc==='car'){drive(dt);aiUpdate(dt);placeCar(dt);}
  pedUpdate(dt);paxWalk(dt);

  if(S.offerCd>0)S.offerCd-=dt;
  linRideUpdate(dt);dlgUpdate(dt);
  for(const t of routeTexs)t.offset.x-=dt*1.4;
  if(ROUTE&&routeTarget){rerouteT+=dt;if(rerouteT>1){rerouteT=0;const n=navInfo();if(n&&n.off>14){setRoute(routeTarget);voice('已为您重新规划路线');}}}
  if(S.order&&S.order.pMesh&&S.order.phase==='toPickup')animPerson(S.order.pMesh,dt,false);
  for(const m of[mkPick,mkDrop]){m.rotation.y+=dt;m.userData.pin=m.children[2];m.children[2].position.y=3.4+Math.sin(performance.now()/300)*.25;}
  if(S.loc==='shop'){linShop.rotation.y=Math.sin(performance.now()/2000)*.15;for(const s of steam){s.userData.t=(s.userData.t+dt*.25)%1;s.position.y=1.6+s.userData.t*1.2;s.material.opacity=.18*(1-s.userData.t);s.scale.setScalar(.2+s.userData.t*.4);}
    if(!drag){car.lookYaw*=.95;car.lookPitch*=.95;}shopCam.rotation.set(car.lookPitch-.08,car.lookYaw,0);}
  envUpdate();
  hudT+=dt;if(hudT>.1){hudT=0;hudUpdate();promptUpdate();audioUpdate();}
  phoneT+=dt;if(phoneT>.5){phoneT=0;doRenderPhone();}
  clusterT+=dt;if(clusterT>.1){clusterT=0;drawCluster();}
  ccT+=dt;if(ccT>.25){ccT=0;drawCC();}
}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;frame++;update(dt);
  const tired=S.energy<20?(20-S.energy)/20:0;
  if(S.loc==='shop'){renderer.shadowMap.needsUpdate=true;renderPost(shopScene,shopCam,{th:1.6,str:.35,tired,exp:1.05});}
  else{
    if(frame%2===0){routeGroup.visible=false;renderer.setRenderTarget(mirrorRT);renderer.toneMapping=THREE.NoToneMapping;renderer.render(scene,mirrorCam);renderer.setRenderTarget(sideRT);renderer.render(scene,sideCam);renderer.setRenderTarget(null);routeGroup.visible=true;}
    renderer.shadowMap.needsUpdate=true;renderPost(scene,camera,{th:lerp(1.4,.9,NIGHT),str:lerp(.25,.85,NIGHT),tired,exp:lerp(1,1.25,NIGHT)});
  }
  placePhoneDOM();
  requestAnimationFrame(loop);}
