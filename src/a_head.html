<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桥西夜班 · 首轮验证 Demo</title>
<style>
:root{color-scheme:dark;--acc:#ff7a1a;--ok:#21c065;--bad:#ff5a5a;--ink:#ecebe7;--dim:#9a9a9f;--panel:rgba(12,14,18,.78)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
.hidden{display:none!important}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:3px;color:#ddd;z-index:50}
/* HUD */
#hud{position:fixed;left:16px;top:14px;background:var(--panel);border-radius:12px;padding:10px 14px;min-width:190px;backdrop-filter:blur(6px);font-size:13px}
#clock{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:12px;color:var(--dim);margin:3px 0 8px}
.hrow{display:flex;justify-content:space-between;align-items:center;margin:4px 0;gap:10px}
.hrow b{font-variant-numeric:tabular-nums}
.track{flex:1;height:6px;background:#2a2c31;border-radius:3px;overflow:hidden}
#energyFill{height:100%;width:80%;background:linear-gradient(90deg,#21c065,#c8f06a);transition:width .4s}#energyFill.low{background:linear-gradient(90deg,#ff5a5a,#ff9a5a)}
#statusLine{font-size:12px;color:var(--dim);margin-top:6px}#tscale{font-size:12px;color:#ffd27a}
#navBanner{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:rgba(18,26,36,.86);border-radius:12px;padding:8px 18px 8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.4);border-left:4px solid #1fa3ff}
#navArrow{font-size:36px;line-height:1;width:40px;text-align:center;color:#6fc8ff}
#navDist{font-size:22px;font-weight:700}#navRoad{font-size:13px;opacity:.85}
#navDdl{font-size:12px;color:#9fe8b0;margin-left:8px}#navDdl.warn{color:#ffc04a}#navDdl.late{color:#ff6a5a}
#prompt{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--panel);padding:9px 18px;border-radius:22px;font-size:15px;border:1px solid rgba(255,255,255,.15)}
kbd,.kbd{display:inline-block;background:#f2f2f2;color:#111;border-radius:5px;padding:0 7px;margin-right:6px;font-family:inherit;font-weight:700;font-size:13px}
#dialog{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);width:min(620px,52vw);background:rgba(10,11,14,.86);border-radius:14px;padding:13px 18px;border-left:3px solid #d5a8ff}
#dlgName{font-size:13px;color:#d5a8ff;margin-bottom:4px;font-weight:700}#dlgText{font-size:16px;line-height:1.6}
#dlgChoices{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.choice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer}
.choice:hover{background:rgba(213,168,255,.16)}.choice.locked{opacity:.4}
#toasts{position:fixed;left:16px;top:170px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:380px}
.toast{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:6px 11px;font-size:12px;animation:tin .25s ease-out;max-width:340px}
.toast.money{border-color:rgba(33,192,101,.6)}.toast.warn{border-color:rgba(255,90,90,.7)}.toast.voice{color:#ffcf9a;border-color:rgba(255,122,26,.4)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
#help{position:fixed;left:16px;bottom:14px;font-size:12px;color:#c9c9cc;background:var(--panel);border-radius:10px;padding:8px 12px;line-height:1.9;max-width:560px}
#phoneHint{position:fixed;right:18px;bottom:10px;font-size:12px;color:#aaa;background:var(--panel);padding:4px 10px;border-radius:10px}
/* ---------- 手机 ---------- */
#phone{position:fixed;left:0;top:0;width:360px;height:760px;border-radius:46px;background:#000;overflow:hidden;transform-origin:0 0;z-index:20;box-shadow:0 0 0 2px #1b1c1f;font-size:14px;color:#111}
#phone.ph-hand{left:auto;top:auto;right:24px;bottom:30px;transform-origin:100% 100%;box-shadow:0 0 0 7px #16171a,0 0 0 9px #3a3c42,0 20px 60px rgba(0,0,0,.6)}
#pStatus{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:6px 26px 0;font-size:13px;font-weight:600;color:#fff;z-index:5;pointer-events:none;mix-blend-mode:difference}
.isl{width:96px;height:28px;background:#000;border-radius:16px;mix-blend-mode:normal}
#pScreen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#f3f4f6}
#pScreen::-webkit-scrollbar{width:0}
#pScreen.home{background:#000}
#pHomeBar{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:5px;border-radius:3px;background:rgba(120,120,120,.8);z-index:6;cursor:pointer}
#pBanner{position:absolute;top:-90px;left:10px;right:10px;background:rgba(245,245,247,.96);border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center;transition:top .35s;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;color:#111}
#pBanner.on{top:50px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13px}
.wall{min-height:100%;padding:70px 22px 24px;color:#fff;background:radial-gradient(ellipse at 70% 0%,#3a4a8a 0%,transparent 60%),linear-gradient(180deg,#141c3c 0%,#2a2350 45%,#7a3a5a 75%,#d07050 100%);position:relative}
.wall:after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)),repeating-linear-gradient(90deg,#0b0e1a 0 18px,#141a2c 18px 30px,#0b0e1a 30px 44px,#10152a 44px 62px);clip-path:polygon(0 60%,6% 60%,6% 35%,10% 35%,10% 55%,18% 55%,18% 20%,21% 8%,24% 20%,24% 50%,32% 50%,32% 30%,40% 30%,40% 60%,48% 60%,48% 10%,50% 0,52% 10%,52% 45%,60% 45%,60% 25%,70% 25%,70% 55%,78% 55%,78% 38%,86% 38%,86% 62%,100% 62%,100% 100%,0 100%);pointer-events:none}
.wclock{font-size:76px;font-weight:300;text-align:center;letter-spacing:2px;line-height:1}.wdate{text-align:center;font-size:14px;opacity:.85;margin:6px 0 18px}
.widget{background:rgba(255,255,255,.16);backdrop-filter:blur(14px);border-radius:20px;padding:12px 14px;font-size:13px;margin-bottom:22px}
.widget .muted{color:rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.icon{text-align:center;cursor:pointer}.ico{width:60px;height:60px;border-radius:15px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.ico.s{width:38px;height:38px;border-radius:10px;font-size:18px;flex:none;margin:0}
.iname{font-size:11.5px;margin-top:5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bdg{position:absolute;top:-5px;right:-5px;background:#ff3b30;color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 5px;font-weight:600}
.dock{position:absolute;left:12px;right:12px;bottom:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(16px);border-radius:26px;padding:12px;display:flex;justify-content:center;z-index:2}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
.muted{color:#8a8c92;font-size:12px}.c{text-align:center}
.appbar{position:sticky;top:0;z-index:3;height:92px;padding:48px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:700;color:#fff}
.appbar .back{cursor:pointer;font-size:26px;width:40px;font-weight:400}.appbar span:last-child{min-width:40px;text-align:right;font-size:12px}
.appbar.didi{background:linear-gradient(90deg,#ff8a2a,#ff6a00)}.appbar.bank{background:#c41f2c}.appbar.ths{background:#e33b2a}.appbar.msgb{background:#f7f7f7;color:#111;border-bottom:1px solid #e3e3e3}
.abody{padding:10px 12px 90px}
.atabs{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid #e6e6e6;padding:8px 0 22px;z-index:3}.atabs div{flex:1;text-align:center;font-size:13px;color:#888;cursor:pointer;position:relative}.atabs div.on{color:#ff6a00;font-weight:700}.atabs.ths div.on{color:#e33b2a}
.pip{position:absolute;top:-2px;right:24px;width:8px;height:8px;border-radius:4px;background:#ff3b30}
.dcard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-size:14px}
.dcard.hero{background:linear-gradient(135deg,#2a2d35,#14161b);color:#fff}.dcard.hero .muted{color:#aaa}.dcard.hot{border:2px solid #ff7a1a;cursor:pointer}.dcard.warn{background:#fff1f0;color:#c41f2c}
.big{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:2px 0 6px}
.sect{font-size:13px;color:#666;margin:12px 4px 6px;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#eceef1;color:#555;margin-right:4px;font-weight:600;vertical-align:middle}
.tag.o{background:#fff0e3;color:#ff6a00}.tag.p{background:#f1e8ff;color:#8a4fd8}.tag.g{background:#e6f8ee;color:#139a50}.tag.r{background:#ffe8e6;color:#e33b2a}.tag.g2{background:#e6f6ec;color:#13a05a}
.btn{display:inline-block;border:none;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;background:#eceef1;color:#222;font-family:inherit}
.btn.pri{background:#ff7a1a;color:#fff}.btn.wide{width:100%;margin-top:8px}.btn.big2{padding:14px;font-size:16px;border-radius:14px}.btn.dis{opacity:.35;pointer-events:none}.btn.dis2{background:#e6e6e6;color:#999}.btn.sm2{padding:4px 10px;font-size:12px}
.btn.buy{background:#e33b2a;color:#fff}.btn.sell{background:#1a8ad8;color:#fff}
.go{display:block;width:150px;height:150px;border-radius:75px;margin:18px auto 6px;border:none;background:radial-gradient(circle at 40% 35%,#ffa04a,#ff6a00);color:#fff;font-size:30px;font-weight:800;box-shadow:0 10px 30px rgba(255,106,0,.45),inset 0 -6px 0 rgba(0,0,0,.12);cursor:pointer;font-family:inherit}
.go small{display:block;font-size:12px;font-weight:500;opacity:.85}.go.off{background:radial-gradient(circle at 40% 35%,#666,#333);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.offer{position:absolute;inset:0;background:linear-gradient(180deg,#ff7a1a 0 30%,#f3f4f6 30%);padding:64px 16px 30px}
.offer>*{position:relative}.otop{margin-bottom:10px}.offer .otop .tag{background:rgba(255,255,255,.25);color:#fff}
.odist{color:#fff;font-size:20px;margin-bottom:16px}.odist b{font-size:42px}
.oroute{background:#fff;border-radius:16px;padding:16px;font-size:17px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.08)}.oroute.sm{background:none;box-shadow:none;padding:4px 0;font-size:14px}
.oroute .vline{width:2px;height:16px;background:#ddd;margin:2px 0 2px 4px}
.dot{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:8px;vertical-align:middle}.dot.g{background:#21c065}.dot.o{background:#ff7a1a}
.ofare{font-size:26px;font-weight:800;color:#ff6a00}.ofare.sm{font-size:18px}
.obtns{position:absolute;left:16px;right:16px;bottom:34px;display:flex;gap:10px}.obtns .btn{padding:18px;font-size:17px;border-radius:16px}.obtns .btn.big{flex:1}
#offerCd{margin-left:8px;font-size:13px;opacity:.85}
.tmap{width:100%;border-radius:14px;display:block;margin-bottom:8px;background:#eee}
.nav{display:flex;align-items:center;gap:12px;background:#1d2330;color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:8px}.narr{font-size:40px;line-height:1;color:#5fc0ff}.nd{font-size:22px;font-weight:800}.nr{font-size:13px;opacity:.8}.neta{margin-left:auto;text-align:right;font-size:12px;opacity:.8}
.ddl{border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:14px;font-weight:700;background:#e6f8ee;color:#139a50}.ddl.warn{background:#fff4e0;color:#d98200}.ddl.late{background:#ffe8e6;color:#e33b2a}
.waitbar{height:6px;background:#eee;border-radius:3px;overflow:hidden}.waitbar div{height:100%;background:#ff7a1a}
.vtitle{font-size:17px;font-weight:800;margin:10px 0 8px;text-align:center}
.vbox{display:flex;gap:10px;justify-content:center;margin-bottom:12px}.vbox span{width:52px;height:60px;border-radius:12px;border:2px solid #ddd;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800}.vbox span.f{border-color:#ff7a1a}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpad div{background:#f2f3f5;border-radius:12px;padding:12px 0;text-align:center;font-size:22px;font-weight:600;cursor:pointer}.kpad div:active{background:#ffd9bd}
.vwarn{background:#ffe8e6;color:#c41f2c;border-radius:12px;padding:12px;font-weight:700;text-align:center}
table.bill{width:100%;border-collapse:collapse;font-size:14px}table.bill td{padding:6px 2px;border-bottom:1px dashed #eee}table.bill td:last-child{text-align:right}table.bill tr.tot td{font-weight:800;font-size:16px}
.up2{color:#139a50}.dn2{color:#e33b2a}
.locked{padding:120px 20px;text-align:center;color:#555;font-size:20px;line-height:1.8}
/* 信息 */
.thread{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #eee;cursor:pointer;background:#fff}
.ava{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;color:#fff;font-size:18px}
.bdg2{background:#ff3b30;color:#fff;border-radius:10px;font-size:12px;padding:1px 7px}
.chat{background:#ededed;min-height:100%}
.bub{max-width:80%;padding:9px 12px;border-radius:14px;margin:7px 0;line-height:1.5;background:#fff;font-size:14px;width:fit-content}
.bub.me{background:#95ec69;margin-left:auto}.bub .t{font-size:10px;color:#999;margin-top:2px}.acts{margin-top:8px;display:flex;gap:6px}
.relbar{height:6px;background:#eee;border-radius:3px;overflow:hidden;margin:8px 0 4px}.relbar>div{height:100%;background:linear-gradient(90deg,#c9a0ff,#ff8ab0)}
.hist{font-size:12px;color:#555;line-height:1.8}
/* 银行 */
.bcard{background:linear-gradient(135deg,#d8333f,#8a0f1a);border-radius:18px;padding:18px;color:#fff;margin-bottom:12px;box-shadow:0 8px 20px rgba(196,31,44,.3)}.bcard .w{color:rgba(255,255,255,.85)}.bcard .big{color:#fff}
.bgrid{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-radius:14px;padding:12px 0;margin-bottom:10px}.bgrid div{text-align:center;font-size:12px;cursor:pointer}.bgrid span{display:block;font-size:22px;color:#c41f2c;margin-bottom:2px}
.seg{display:flex;background:#eceef1;border-radius:10px;padding:3px;margin-bottom:10px}.seg span{flex:1;text-align:center;padding:7px 0;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;color:#666}.seg span.on{background:#fff;color:#111;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.seg span.on.buy{color:#e33b2a}.seg span.on.sell{color:#1a8ad8}.seg.sm{margin:4px 0 8px}.seg.in{display:inline-flex;margin:0;width:120px}
.amt{font-size:34px;font-weight:800;text-align:center;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chips span{background:#f2f3f5;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
/* 同花顺 */
.app-ths{background:#f5f5f5!important}
.mst{font-size:11px!important;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:8px}.mst.on{background:#fff;color:#e33b2a}
.icard{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}.bigi{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.chart{width:100%;display:block;margin-top:6px;border-radius:8px}
.up{color:#e33b2a}.dn{color:#13a05a}
.slist{background:#fff;border-radius:14px;overflow:hidden}
.srow{display:grid;grid-template-columns:1.4fr 1fr 1fr;align-items:center;padding:10px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;font-size:15px}.srow>div:nth-child(2),.srow>div:nth-child(3){text-align:right}
.srow.hd{font-size:12px;color:#999;cursor:default;padding:6px 14px}
.px{font-weight:700;font-variant-numeric:tabular-nums}.chip{justify-self:end;min-width:78px;text-align:center;border-radius:6px;padding:5px 0;color:#fff;font-weight:700;background:#999}.chip.up{background:#e33b2a;color:#fff}.chip.dn{background:#13a05a;color:#fff}
.link{color:#1a6ad8;cursor:pointer;font-size:13px}
.shead{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px}.bigp{font-size:34px;font-weight:800}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px;color:#888;margin-top:6px}.kv b{color:#222;font-weight:600}
.book{background:#fff;border-radius:14px;padding:8px 14px;margin:8px 0;font-size:13px}.book div{display:grid;grid-template-columns:40px 1fr 1fr;padding:2px 0}.book div span:last-child{text-align:right;color:#666}.book .bid:first-of-type{border-top:1px solid #eee}
.book div:nth-child(6){border-top:1px solid #eee;padding-top:4px}
.bs{position:sticky;bottom:70px}.bs .btn{flex:1;padding:14px;font-size:16px;border-radius:12px}
.pick{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.pick span{flex:none;background:#f2f3f5;border-radius:12px;padding:4px 10px;font-size:12px;cursor:pointer}.pick span.on{background:#ffe8e6;color:#e33b2a;font-weight:700}
.step{display:flex;align-items:center;justify-content:space-between;background:#f5f6f8;border-radius:10px;margin:8px 0}.step span{width:52px;text-align:center;font-size:22px;padding:8px 0;cursor:pointer;color:#555}.step b{font-size:17px}
.tmsg{margin-top:8px;padding:8px 10px;border-radius:8px;background:#e6f8ee;color:#139a50;font-size:13px}.tmsg.bad{background:#ffe8e6;color:#e33b2a}
.ord{font-size:12px;border-bottom:1px solid #f2f2f2;padding:5px 0}
.news{font-size:13px;line-height:1.6;cursor:pointer}
/* 模态 */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:40}
#modal.side{background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,0) 60%);justify-content:flex-start;padding-left:40px;z-index:15}
#modalCard{background:#121418;border:1px solid #2a2d34;border-radius:16px;padding:22px 26px;width:min(760px,92vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal.side #modalCard{width:430px}
#modalCard h1{margin:0 0 4px;font-size:30px;letter-spacing:4px}#modalCard h2{margin:0 0 6px;font-size:20px}
#modalCard p{line-height:1.75;color:#cfcfd2;font-size:14px;margin:8px 0}
#modalCard table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}#modalCard td,#modalCard th{padding:5px 6px;border-bottom:1px solid #22252b;text-align:left}#modalCard th{color:var(--dim);font-weight:400}
#modalCard .muted{color:var(--dim)}#modalCard .btn{background:#2a2d34;color:var(--ink)}#modalCard .btn.pri{background:var(--acc);color:#fff}
.opt{display:block;width:100%;text-align:left;background:#1a1d22;border:1px solid #262930;border-radius:10px;padding:10px 12px;margin:7px 0;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--acc)}.opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.opt.dis{opacity:.4;pointer-events:none}
.say{background:#1a1d22;border-left:3px solid #d5a8ff;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px;line-height:1.7}.say b{color:#d5a8ff}
.ctrls{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;color:#cfcfd2;margin:10px 0}
#boot{position:fixed;inset:0;z-index:100;background:#0b0c10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}#boot .bt{font-size:34px;letter-spacing:8px;font-weight:700}#boot .bs{color:#9a9a9f;font-size:13px}#boot .bb{width:320px;height:4px;background:#22252b;border-radius:2px;overflow:hidden}#bootBar{height:100%;width:0;background:#ff7a1a;transition:width .2s}
#loadErr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font-size:16px;padding:40px;text-align:center;line-height:1.8;z-index:99}


/* ======== 现代 HUD ======== */
@font-face{font-family:Inter;font-weight:300;src:url(lib/fonts/inter-latin-300-normal.woff2) format('woff2');}
@font-face{font-family:Inter;font-weight:400;src:url(lib/fonts/inter-latin-400-normal.woff2) format('woff2');}
@font-face{font-family:Inter;font-weight:500;src:url(lib/fonts/inter-latin-500-normal.woff2) format('woff2');}
@font-face{font-family:Inter;font-weight:600;src:url(lib/fonts/inter-latin-600-normal.woff2) format('woff2');}
:root{--f:Inter,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;--ts:0 1px 3px rgba(0,0,0,.55),0 0 12px rgba(0,0,0,.25);--glass:rgba(18,20,26,.42);--line:rgba(255,255,255,.14);--acc:#ffb547}
body{font-family:var(--f)}
#hud{left:auto;right:34px;top:28px;background:none;border:none;padding:0;min-width:0;backdrop-filter:none;text-align:right;font-family:var(--f);color:#fff}
#clock{font-size:26px;font-weight:300;letter-spacing:.5px;text-shadow:var(--ts);font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:12px;color:rgba(255,255,255,.72);text-shadow:var(--ts);margin:6px 0 14px;letter-spacing:.3px}
.money{display:inline-block;text-align:right}
#cash{font-size:24px;font-weight:500;color:#fff;text-shadow:var(--ts);font-variant-numeric:tabular-nums;letter-spacing:.3px}#cash.neg{color:#ff7a7a}
#dwLine{font-size:12px;color:rgba(255,255,255,.62);text-shadow:var(--ts);margin-top:3px}#dwLine span{color:var(--acc);font-weight:500}
#tscale{font-size:12px;color:var(--acc);text-shadow:var(--ts);margin-top:8px}
#toasts{position:static;margin-top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;max-width:none}
.toast{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-size:12.5px;color:#f2f2f2;max-width:300px;text-align:left;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast b{font-weight:600}.toast.money{border-color:rgba(120,220,150,.35)}.toast.warn{border-color:rgba(255,120,110,.45)}.toast.voice{color:#ffe2bd}
.vt{display:inline-block;font-size:10px;background:rgba(255,181,71,.9);color:#1b1206;padding:0 6px;border-radius:6px;margin-right:6px;font-weight:600}
#radarWrap{position:fixed;left:34px;bottom:30px;width:200px}
.rad{position:relative;width:200px;height:200px;border-radius:50%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.18);-webkit-mask-image:radial-gradient(circle,#000 62%,rgba(0,0,0,.85) 72%,transparent 100%);mask-image:radial-gradient(circle,#000 62%,rgba(0,0,0,.85) 72%,transparent 100%)}
#radar{width:200px;height:200px;display:block;opacity:.92}
.north{position:absolute;left:50%;top:6px;transform:translateX(-50%);font-size:10px;font-weight:600;color:rgba(255,255,255,.75)}
#radarNav{display:flex;align-items:center;gap:10px;margin:0 0 10px 2px;color:#fff;text-shadow:var(--ts)}
#navArrow{font-size:26px;line-height:1;color:var(--acc);width:28px;text-align:center}#navDist{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}#navRoad{font-size:12px;color:rgba(255,255,255,.75)}
#navDdl{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(80,200,120,.25);color:#bff0cf}#navDdl.warn{background:rgba(255,181,71,.25);color:#ffe2b0}#navDdl.late{background:rgba(255,90,80,.3);color:#ffc2bc}#navDdl:empty{display:none}
#loc{position:static;margin-top:10px;text-shadow:var(--ts)}#statusLine{font-size:14px;font-weight:500;color:#fff;font-style:normal;margin:0}#locSub{font-size:11.5px;color:rgba(255,255,255,.62);margin-top:2px}
#speedo{position:fixed;right:34px;bottom:30px;text-align:right;color:#fff;text-shadow:var(--ts);font-family:var(--f)}
#spd{font-size:52px;font-weight:300;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-1px}.unit{font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.65);margin-bottom:10px}
.sbars>div{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:5px}.sbars i{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.6)}.sbars .bar{width:110px;height:3px;border-radius:2px;background:rgba(255,255,255,.16);overflow:hidden;display:block}.sbars b{display:block;height:100%;background:#fff;border-radius:2px;transition:width .5s}#energyFill.low{background:#ff7a6e}
#prompt{left:50%;top:auto;bottom:22%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;padding:8px 16px 8px 8px;font-size:13.5px;color:#fff;display:flex;align-items:center;gap:10px}
#prompt kbd,.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:#fff;color:#111;font-weight:600;font-size:12px;margin:0 2px;font-family:var(--f)}
#dialog{bottom:12%;width:min(780px,70vw);background:none;border:none;padding:0;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.8)}
#dlgName{color:var(--acc);font-size:12px;letter-spacing:2px;font-weight:600;margin-bottom:6px}#dlgText{font-size:18px;color:#fff;line-height:1.55;font-weight:400}
#dlgChoices{align-items:center;margin-top:14px;gap:8px}.choice{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:12px;color:#fff;text-shadow:none;min-width:360px;text-align:left;padding:9px 14px;font-size:14px}.choice:hover{background:rgba(255,255,255,.16)}
.choice .kbd{width:22px;min-width:22px;height:22px;margin-right:10px}
/* 菜单 */
#menu{position:fixed;inset:0;z-index:60;display:flex;background:rgba(8,10,14,.45);backdrop-filter:blur(22px) saturate(1.1);-webkit-backdrop-filter:blur(22px);color:#fff;font-family:var(--f)}
.mside{width:280px;padding:56px 40px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent)}
.mlogo{font-size:22px;font-weight:600;letter-spacing:6px;margin-bottom:34px}
.mtabs div{padding:11px 0;font-size:15px;color:rgba(255,255,255,.6);cursor:pointer;border-left:2px solid transparent;padding-left:14px;margin-left:-16px}.mtabs div.on,.mtabs div:hover{color:#fff;border-left-color:var(--acc)}
.mfoot{margin-top:auto;font-size:12px;color:rgba(255,255,255,.45)}
.mbody{flex:1;padding:56px 60px;overflow:auto;max-width:860px}
.mbody h3{font-size:13px;letter-spacing:3px;color:rgba(255,255,255,.5);font-weight:500;margin:0 0 18px}
.krow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}.krow span:last-child{display:flex;gap:4px}
.seg2{display:inline-flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px}.seg2 span{padding:5px 14px;border-radius:8px;font-size:13px;cursor:pointer;color:rgba(255,255,255,.7)}.seg2 span.on{background:#fff;color:#111}
.mbtn{display:inline-block;margin-top:24px;padding:11px 26px;border-radius:12px;background:#fff;color:#111;font-weight:600;cursor:pointer;font-size:14px}
.credit{font-size:12.5px;color:rgba(255,255,255,.7);line-height:1.9}
/* 弹窗 / 启动页 */
#modal{background:rgba(6,8,12,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
#modal.side{background:linear-gradient(90deg,rgba(6,8,12,.55),rgba(6,8,12,0) 65%);backdrop-filter:none}
#modalCard{border-radius:20px;background:rgba(16,18,24,.62);backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.4);font-family:var(--f)}
#modalCard h1{font-weight:600;font-size:40px;letter-spacing:10px;margin-bottom:8px}#modalCard h2{font-weight:500}
#modalCard p{color:rgba(255,255,255,.78)}
.opt{border-radius:12px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06)}.opt:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18)}
#modalCard .btn.pri{background:#fff;color:#111;border-radius:12px}
.say{background:rgba(255,255,255,.06);border-left:2px solid var(--acc);border-radius:8px}.say b{color:var(--acc)}
#boot{background:radial-gradient(ellipse at 50% 70%,#1b2130,#06070a)}#boot .bt{font-family:var(--f);font-weight:600;font-size:46px;letter-spacing:16px}#boot .bb{width:280px;height:2px}#bootBar{background:#fff}
</style>
</head>
