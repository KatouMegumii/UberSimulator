</script>
<script src="lib/engine.js"></script>
<script src="assets/pack/index.js"></script>
<script>
// 两种加载路径，同一份代码：
//   file:// 双击版：资源打包成 assets/pack/*.js，用 <script> 载入后转成 blob 地址
//   web 版（window.__WEB=1）：直接按 URL 拉 assets/ 里的原始文件，浏览器并发 + 按文件缓存
(function(){
  const $=s=>document.querySelector(s);
  const WEB=!!window.__WEB;
  if(!window.THREE){$('#bootMsg').textContent='缺少 lib/engine.js，请确认整个文件夹完整';return;}
  if(!WEB&&!window.__PACKS){$('#bootMsg').textContent='缺少 assets/pack，请确认整个文件夹完整';return;}
  if(WEB&&!window.__MANIFEST){$('#bootMsg').textContent='缺少 assets/manifest.js，请确认整个文件夹完整';return;}
  const BLOB={},RAW={};
  window.__pack=(path,b64,mime)=>{const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);RAW[path]=u;BLOB[path]=URL.createObjectURL(new Blob([u],{type:mime||'application/octet-stream'}));};
  const SIZES=WEB?__MANIFEST.sizes:{};
  let total=WEB?0:__PACKS.reduce((a,p)=>a+p[1],0),got=0;
  if(!WEB)$('#bootMsg').textContent='正在载入资源（约 '+Math.round(total/1e6)+'MB）…';
  function loadPack(i){if(i>=__PACKS.length){start();return;}const s=document.createElement('script');s.src='assets/pack/'+__PACKS[i][0];
    s.onload=()=>{got+=__PACKS[i][1];$('#bootBar').style.width=(got/total*90)+'%';$('#bootSub').textContent=__PACKS[i][2]||'';s.remove();setTimeout(()=>loadPack(i+1),0);};
    s.onerror=()=>{$('#bootMsg').textContent='资源文件缺失：'+__PACKS[i][0];};document.head.appendChild(s);}
  async function start(){
    if(!WEB)$('#bootMsg').textContent='正在解析模型和贴图…';
    const A=window.ASSETS={hdr:{},img:{},gltf:{}};
    const mgr=new THREE.LoadingManager();
    if(!WEB)mgr.setURLModifier(u=>{const k=u.replace(/^\.\//,'').replace(/\/\.\//g,'/');return BLOB[k]||BLOB[decodeURI(k)]||u;});
    const gl=new GLTFLoader(mgr),rl=new RGBELoader(mgr);
    const TEX=['road','pave','brick','plaster','tile','concrete','roof','shopfloor','shopwall','lawn','plaza','ground','gable'];const jobs=[];
    for(const k of TEX)for(const m of['diff','nor','rough'])jobs.push(['img',k+'_'+m,`assets/tex/${k}_${m}.jpg`]);
    for(const[k,f]of[['day','kloofendal_48d_partly_cloudy_puresky_2k'],['dusk','industrial_sunset_02_puresky_2k'],['night','shanghai_bund_2k']])jobs.push(['hdr',k,`assets/hdr/${f}.hdr`]);
    for(const m of['utility_box_01','utility_box_02','metal_trash_can','rollershutter_door','plastic_monobloc_chair_01','chinese_stool'])jobs.push(['gltf',m,`assets/models/${m}/${m}.gltf`]);
    for(const m of['corolla','superb','trees4k','nathan','sophia','mbarrier','bench','bushes','eric','carla','claudia','bus','charger'])jobs.push(['gltf',m,`assets/models/${m}.glb`]);
    jobs.push(['json','map','assets/map/map.json']);
    if(WEB){total=jobs.reduce((a,j)=>a+(SIZES[j[2]]||0),0);
      $('#bootMsg').textContent='正在载入资源（约 '+Math.round(total/1e6)+'MB）…';}
    let done=0;const tick=(url)=>{done++;
      $('#bootSub').textContent=url;
      if(WEB){got+=SIZES[url]||0;$('#bootBar').style.width=Math.min(99,got/total*100)+'%';}
      else $('#bootBar').style.width=(90+done/jobs.length*10)+'%';};
    await Promise.all(jobs.map(([t,k,url])=>{let p;
      if(!WEB&&!BLOB[url]&&t!=='gltf')return Promise.resolve(tick(url));
      if(t==='img')p=new Promise((res,rej)=>{const im=new Image();im.onload=()=>{A.img[k]=im;res();};im.onerror=rej;im.src=WEB?url:BLOB[url];});
      else if(t==='hdr')p=rl.loadAsync(url).then(h=>{A.hdr[k]=h;});
      else if(t==='json')p=WEB?fetch(url).then(r=>r.text()).then(t=>{A.map=JSON.parse(t);}):Promise.resolve().then(()=>{A.map=JSON.parse(new TextDecoder().decode(RAW[url]));});
      else p=gl.loadAsync(url).then(g=>{A.gltf[k]=g;});
      return p.then(()=>tick(url),e=>{console.warn('asset failed',url,e);tick(url);});}));
    for(const k in RAW)delete RAW[k];for(const k in BLOB){URL.revokeObjectURL(BLOB[k]);delete BLOB[k];}
    $('#bootBar').style.width='100%';
    if(!A.map){$('#bootMsg').textContent='地图数据加载失败';return;}
    window.__runGame();
  }
  window.__runGame=function(){if(window.__started)return;window.__started=1;THREE.ColorManagement.legacyMode=false;
    const s=document.createElement('script');s.textContent=document.getElementById('gamecode').textContent;document.body.appendChild(s);const b=document.getElementById('boot');if(b)b.remove();};
  if(WEB){start();}else{loadPack(0);}
})();
</script>
</body>
</html>
