</script>
<script type="module">
import * as THREE from './lib/three.module.js';
import {GLTFLoader} from './lib/GLTFLoader.js';
import {RGBELoader} from './lib/RGBELoader.js';
import * as SkeletonUtils from './lib/SkeletonUtils.js';window.SkeletonUtils=SkeletonUtils;
window.THREE=THREE;window.__boot=1;
const A=window.ASSETS={hdr:{},img:{},gltf:{}};
const $=s=>document.querySelector(s);
const TEX=['road','pave','brick','plaster','tile','concrete','roof','shopfloor','shopwall'];
const jobs=[];
for(const k of TEX)for(const m of['diff','nor','rough'])jobs.push(['img',k+'_'+m,`assets/tex/${k}_${m}.jpg`]);
for(const[k,f]of[['day','kloofendal_48d_partly_cloudy_puresky_2k'],['dusk','industrial_sunset_02_puresky_2k'],['night','shanghai_bund_2k']])jobs.push(['hdr',k,`assets/hdr/${f}.hdr`]);
for(const m of['utility_box_01','utility_box_02','metal_trash_can','rollershutter_door','plastic_monobloc_chair_01','chinese_stool','water_manhole_cover'])jobs.push(['gltf',m,`assets/models/${m}/${m}.gltf`]);
jobs.push(['gltf','corolla','assets/models/corolla.glb']);for(const m of['trees4k','nathan','sophia'])jobs.push(['gltf',m,`assets/models/${m}.glb`]);jobs.push(['gltf','superb','assets/models/superb.glb']);jobs.push(['json','map','assets/map/map.json']);
let done=0;const tick=n=>{done++;$('#bootBar').style.width=(done/jobs.length*100)+'%';$('#bootSub').textContent=n;};
$('#bootMsg').textContent='正在加载写实资源（约 70MB，首次较慢）…';
const gl=new GLTFLoader(),rl=new RGBELoader();
await Promise.all(jobs.map(([t,k,url])=>{
  let p;
  if(t==='img')p=new Promise((res,rej)=>{const im=new Image();im.onload=()=>{A.img[k]=im;res();};im.onerror=rej;im.src=url;});
  else if(t==='hdr')p=rl.loadAsync(url).then(h=>{A.hdr[k]=h;});
  else if(t==='json')p=fetch(url).then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{A.map=j;});
  else p=gl.loadAsync(url).then(async g=>{A.gltf[k]=g;if(k==='car'){const js=g.parser.json;const want=['Paint 1 Pearl','Interior 3 Graphite','Paint 2 Graphite'];g.extraMats={};for(let i=0;i<js.materials.length;i++)if(want.includes(js.materials[i].name))g.extraMats[js.materials[i].name]=await g.parser.getDependency('material',i);}});
  return p.then(()=>tick(url.split('/').pop()),e=>{console.warn('asset missing',url);tick('缺失：'+url.split('/').pop());});
}));
window.__runGame();
</script>
<script>
window.__runGame=function(){if(window.__started)return;window.__started=1;if(window.THREE&&THREE.ColorManagement)THREE.ColorManagement.legacyMode=false;
  const s=document.createElement('script');s.textContent=document.getElementById('gamecode').textContent;document.body.appendChild(s);
  const b=document.getElementById('boot');if(b)b.remove();};
// 本地双击打开（file://）时无法加载模块和资源：退回 CDN 版 Three.js + 程序化画面
function fallback(){if(window.__boot||window.__started)return;document.getElementById('bootMsg').textContent='本地打开模式：不加载写实资源（请用 GitHub Pages 或本地服务器访问）';
  const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js';s.onload=()=>{window.ASSETS={hdr:{},img:{},gltf:{}};window.__runGame();};
  s.onerror=()=>{document.getElementById('bootMsg').textContent='无法加载 Three.js，请检查网络';};document.head.appendChild(s);}
if(location.protocol==='file:')setTimeout(fallback,300);else setTimeout(fallback,20000);
</script>
</body>
