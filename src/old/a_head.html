<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桥西夜班 · 首轮验证 Demo</title>
<style>
:root{color-scheme:dark;--acc:#ff8a2a;--ok:#3fe08a;--bad:#ff5a5a;--ink:#ecebe7;--dim:#9a9a9f;--panel:rgba(14,16,20,.82)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",sans-serif;color:var(--ink);user-select:none}
#c{position:fixed;inset:0;display:block;width:100%;height:100%}
.hidden{display:none!important}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.92));opacity:0;transition:opacity .8s}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center;font-size:20px;letter-spacing:3px;color:#ddd;z-index:50}
/* HUD */
#hud{position:fixed;left:18px;top:16px;background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px;min-width:210px;backdrop-filter:blur(6px)}
#clock{font-size:34px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:13px;color:var(--dim);margin:4px 0 10px}
.hrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin:5px 0;gap:10px}
.hrow b{font-size:15px;font-variant-numeric:tabular-nums}
.track{flex:1;height:7px;background:#2a2c31;border-radius:4px;overflow:hidden}
#energyFill{height:100%;width:80%;background:linear-gradient(90deg,#3fe08a,#c8f06a);transition:width .4s}
#statusLine{font-size:12px;color:var(--dim);margin-top:8px}
#tscale{font-size:12px;color:#ffd27a;margin-top:2px}
/* nav banner */
#navBanner{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:rgba(18,92,70,.9);border-radius:12px;padding:10px 20px 10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#navArrow{font-size:40px;line-height:1;width:44px;text-align:center}
#navDist{font-size:24px;font-weight:700}
#navRoad{font-size:14px;opacity:.9}
/* prompt & dialog */
#prompt{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--panel);padding:10px 18px;border-radius:24px;font-size:15px;border:1px solid rgba(255,255,255,.15)}
#prompt kbd,.kbd{display:inline-block;background:#f2f2f2;color:#111;border-radius:5px;padding:0 7px;margin-right:6px;font-family:inherit;font-weight:700;font-size:13px}
#dialog{position:fixed;left:50%;bottom:200px;transform:translateX(-50%);width:min(620px,52vw);background:rgba(10,11,14,.88);border-radius:14px;padding:14px 18px;border-left:3px solid var(--acc)}
#dlgName{font-size:13px;color:var(--acc);margin-bottom:4px;font-weight:700}
#dlgText{font-size:16px;line-height:1.6}
#dlgChoices{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.choice{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 10px;font-size:14px;cursor:pointer;text-align:left;color:var(--ink)}
.choice:hover{background:rgba(255,138,42,.18)}
.choice.locked{opacity:.4;cursor:not-allowed}
/* toasts */
#toasts{position:fixed;right:340px;top:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{background:var(--panel);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 14px;font-size:13px;max-width:340px;animation:tin .25s ease-out}
.toast.money{border-color:rgba(63,224,138,.5)}
.toast.warn{border-color:rgba(255,90,90,.6)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
/* help */
#help{position:fixed;left:18px;bottom:16px;font-size:12px;color:#c9c9cc;background:var(--panel);border-radius:10px;padding:9px 12px;line-height:1.9;max-width:520px}
/* phone */
#phone{position:fixed;right:18px;bottom:16px;width:306px;height:580px;background:#0c0d10;border-radius:34px;border:6px solid #23252b;box-shadow:0 10px 40px rgba(0,0,0,.6),inset 0 0 0 1px #3a3d44;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
#phone.collapsed{transform:translateY(500px)}
#pStatus{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:12px;color:#ddd}
#pApp{flex:1;overflow-y:auto;padding:4px 12px 10px;font-size:13px}
#pApp::-webkit-scrollbar{width:4px}#pApp::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
#pTabs{display:flex;border-top:1px solid #1f2126;background:#111317}
.tab{flex:1;text-align:center;padding:8px 0 10px;font-size:11px;color:#8a8b90;cursor:pointer;position:relative}
.tab.on{color:var(--acc)}
.tab .badge{position:absolute;top:3px;right:5px;background:var(--bad);color:#fff;border-radius:8px;font-size:9px;padding:0 4px;line-height:14px}
.ph1{font-size:17px;font-weight:700;margin:6px 0 8px;display:flex;justify-content:space-between;align-items:center}
.card{background:#16181d;border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid #1f2228}
.card.hot{border-color:var(--acc);box-shadow:0 0 0 1px rgba(255,138,42,.3)}
.muted{color:var(--dim);font-size:12px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:3px 0}
.btn{display:inline-block;border:none;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer;background:#2a2d34;color:var(--ink);font-family:inherit}
.btn.pri{background:var(--acc);color:#1a0d00}
.btn.ok{background:var(--ok);color:#002010}
.btn.wide{width:100%;margin-top:6px}
.btn.dis{opacity:.35;pointer-events:none}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:8px;background:#2a2d34;color:#ddd;margin-right:4px}
.tag.o{background:rgba(255,138,42,.2);color:#ffb070}.tag.p{background:rgba(190,110,255,.2);color:#d5a8ff}.tag.g{background:rgba(63,224,138,.18);color:#7ef0b0}.tag.r{background:rgba(255,90,90,.2);color:#ff9a9a}
.switch{width:52px;height:28px;border-radius:14px;background:#33363d;position:relative;cursor:pointer;transition:background .2s}
.switch.on{background:var(--ok)}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}
.switch.on:after{left:27px}
.cd{height:4px;background:#2a2d34;border-radius:2px;margin-top:8px;overflow:hidden}.cd>div{height:100%;background:var(--acc)}
.thread{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid #1a1c21;cursor:pointer}
.ava{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.bub{max-width:86%;padding:7px 10px;border-radius:10px;margin:5px 0;line-height:1.5;background:#1f2228}
.bub.me{background:#2f6b45;margin-left:auto}
.bub .t{font-size:10px;color:#888;margin-top:2px}
.locked{padding:40px 10px;text-align:center;color:var(--dim)}
.relbar{height:6px;background:#2a2d34;border-radius:3px;overflow:hidden;margin:4px 0}.relbar>div{height:100%;background:linear-gradient(90deg,#d5a8ff,#ff8ab0)}
.hist{font-size:11px;color:#aaa;line-height:1.7;max-height:150px;overflow:auto}
canvas.mini{width:100%;border-radius:12px;display:block;background:#1b1e24}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:40}
#modal.side{background:linear-gradient(90deg,rgba(0,0,0,.65),rgba(0,0,0,0) 60%);justify-content:flex-start;padding-left:40px}
#modalCard{background:#121418;border:1px solid #2a2d34;border-radius:16px;padding:22px 26px;width:min(720px,90vw);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#modal.side #modalCard{width:420px}
#modalCard h1{margin:0 0 4px;font-size:30px;letter-spacing:4px}
#modalCard h2{margin:0 0 6px;font-size:20px}
#modalCard p{line-height:1.75;color:#cfcfd2;font-size:14px;margin:8px 0}
#modalCard table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
#modalCard td,#modalCard th{padding:5px 6px;border-bottom:1px solid #22252b;text-align:left}
#modalCard th{color:var(--dim);font-weight:400}
.opt{display:block;width:100%;text-align:left;background:#1a1d22;border:1px solid #262930;border-radius:10px;padding:10px 12px;margin:7px 0;color:var(--ink);font-size:14px;cursor:pointer;font-family:inherit}
.opt:hover{border-color:var(--acc)}
.opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
.opt.dis{opacity:.4;pointer-events:none}
.say{background:#1a1d22;border-left:3px solid #d5a8ff;padding:8px 12px;border-radius:6px;margin:8px 0;font-size:14px;line-height:1.7}
.say b{color:#d5a8ff}
.ctrls{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;color:#cfcfd2;margin:10px 0}
#loadErr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#eee;font-size:16px;padding:40px;text-align:center;line-height:1.8;z-index:99}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div id="clock">16:30</div>
  <div id="date">第1天 · 周五</div>
  <div class="hrow"><span>现金</span><b id="cash">¥180</b></div>
  <div class="hrow"><span>精力</span><div class="track"><div id="energyFill"></div></div><b id="energyV">80</b></div>
  <div class="hrow"><span>社交</span><b id="socialV">0</b></div>
  <div id="statusLine">离线 · 停车</div>
  <div id="tscale">时间 ×1（T 切换）</div>
</div>
<div id="navBanner" class="hidden"><div id="navArrow">↑</div><div><div id="navDist">—</div><div id="navRoad"></div></div></div>
<div id="dialog" class="hidden"><div id="dlgName"></div><div id="dlgText"></div><div id="dlgChoices"></div></div>
<div id="prompt" class="hidden"></div>
<div id="toasts"></div>
<div id="help"><span class="kbd">W/S</span>油门 / 刹车倒车　<span class="kbd">A/D</span>转向　<span class="kbd">空格</span>手刹　<span class="kbd">E</span>互动<br><span class="kbd">1/2/3</span>接单·跳过·对话选项　<span class="kbd">O</span>上线/下线　<span class="kbd">鼠标拖动</span>环顾<br><span class="kbd">T</span>时间倍速　<span class="kbd">P</span>收起手机　<span class="kbd">H</span>隐藏提示</div>
<div id="phone"><div id="pStatus"><span id="pTime">16:30</span><span>顺路出行 · 5G ▮▮▮</span></div><div id="pApp"></div><div id="pTabs"></div></div>
<div id="modal" class="hidden"><div id="modalCard"></div></div>
<div id="fade"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script>
