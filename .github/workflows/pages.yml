name: Deploy to GitHub Pages

# 仓库根目录只放源码（src/ + assets/ + vendor/），产物由 CI 现场构建，
# 不把 dist/（~144MB）提交进 git。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build web bundle
        run: python3 build.py --web

      - name: Stage site
        run: |
          ls -la dist/web
          du -sh dist/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
